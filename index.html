<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Fluent Science Reading 互动英语科普学习卡片。">
  <meta property="og:title" content="Fluent Science Reading Lesson">
  <meta property="og:description" content="Read · Think · Explain — 互动英语科普学习卡片。">
  <meta property="og:image" content="/og.png">
  <meta name="twitter:card" content="summary_large_image">
  <title>学习卡片 · Fluent Science Reading</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    .lesson-head { display: grid; grid-template-columns: 1fr auto; gap: 18px; align-items: end; padding: 22px 24px; margin-bottom: 12px; }
    .lesson-head h1 { margin: 0; font-size: clamp(27px,4vw,42px); line-height: 1.08; }
    .lesson-meta { display: flex; gap: 7px; flex-wrap: wrap; margin-bottom: 8px; }
    .module-nav { position: sticky; top: 8px; z-index: 20; display: grid; grid-template-columns: repeat(4,1fr); gap: 6px; padding: 7px; margin-bottom: 14px; background: rgba(255,255,255,.94); backdrop-filter: blur(12px); }
    .module-tab { min-width: 0; border: 0; border-radius: 13px; padding: 10px 7px; background: transparent; color: var(--muted); cursor: pointer; font-size: 12px; font-weight: 850; }
    .module-tab span { display: block; margin: 0 auto 4px; width: 8px; height: 8px; border: 2px solid #a8b5c4; border-radius: 50%; }
    .module-tab.active { color: var(--blue); background: var(--blue-soft); }
    .module-tab.done span { border-color: var(--green); background: var(--green); }
    .module-tab.locked { color: #c2ccd8; cursor: not-allowed; }
    .workspace { min-height: 620px; }
    #app { user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
    .module { display: none; }
    .module.active { display: block; }
    .split { display: grid; grid-template-columns: 1.02fr .98fr; gap: 16px; align-items: start; }
    .lesson-card { display: grid; grid-template-columns: minmax(0, 52%) 1fr; overflow: hidden; }
    .lesson-card-image { min-width: 0; background: #fff; display: grid; place-items: start center; padding: 22px 12px 12px; }
    .lesson-card-image .cover { display: block; max-width: 100%; max-height: 100%; width: auto; height: auto; object-fit: contain; border-radius: 10px; }
    .lesson-card .article-copy { min-width: 0; }
    .content-card { padding: 17px; }
    .cover { display: block; width: 100%; height: auto; object-fit: contain; border-radius: 15px; background: #eef2f6; }
    .article-copy { padding: 22px; }
    .task-title { display: inline-flex; align-items: center; gap: 10px; padding: 7px 16px; border-radius: 999px; background: #f1f5fa; }
    .task-title .task-tag { color: var(--blue); }
    .task-title .task-divider { width: 2px; height: 15px; border-radius: 2px; background: var(--line); }
    .task-title .task-name { color: var(--ink); }
    .article-head { margin-bottom: 8px; }
    .article-head .eyebrow { margin: 0 0 6px; font-size: 12px; }
    .article-head .section-title { margin-bottom: 4px; }
    .article-head .muted { margin: 3px 0 0; font-size: 16px; font-weight: 400; }
    .article-copy p { margin: 0 0 16px; font-size: clamp(18px,2.2vw,24px); line-height: 1.85; font-weight: 800; letter-spacing: .01em; }
    .combined-listening { margin: 10px 0 20px; scroll-margin-top: 110px; }
    .practice-section { margin-top: 16px; scroll-margin-top: 110px; }
    .module-complete { display:flex; align-items:center; justify-content:space-between; gap:16px; margin-top:16px; padding:16px 18px; border-radius:16px; background:var(--surface-warm); border:1px solid #f3dcc6; }
    .module-complete strong { display:block; font-size:17px; font-weight:900; }
    .module-complete small { display:block; margin-top:3px; color:var(--muted); font-size:13px; font-weight:650; }
    .module-complete .btn { flex:0 0 auto; min-width:140px; }
    .module-actions { display:flex; flex-wrap:wrap; gap:10px; align-items:center; flex:0 0 auto; }
    .module-prev { display:grid; place-items:center; align-self:stretch; width:44px; flex:0 0 auto; margin:-16px 0 -16px -18px; border:0; border-right:1px solid #e5d3bf; border-radius:16px 0 0 16px; background:transparent; color:#8f6a42; cursor:pointer; }
    .module-prev svg { width:18px; height:18px; }
    .module-prev:hover { background:rgba(255,255,255,.6); color:#5f4527; }
    .module-prev:disabled { opacity:.38; cursor:default; }
    .module-prev:disabled:hover { background:transparent; color:#8f6a42; }
    .error-banner { position:sticky; top:8px; z-index:60; display:flex; align-items:flex-start; gap:12px; margin-bottom:12px; padding:12px 14px; border:1px solid #f0c4be; border-radius:14px; background:#fff6f4; color:#7c3021; box-shadow:0 12px 28px rgba(201,77,77,.14); animation:error-banner-in .25s cubic-bezier(.2,.8,.2,1) both; }
    .error-banner.hidden { display:none; }
    .error-banner-copy { min-width:0; }
    .error-banner-copy strong { display:block; font-size:14px; font-weight:900; }
    .error-banner-copy p { margin:3px 0 0; font-size:13px; line-height:1.5; }
    .error-banner-copy small { display:block; margin-top:4px; color:#a05a4d; font-size:11px; line-height:1.4; }
    .error-banner-actions { display:flex; align-items:center; gap:8px; margin-left:auto; flex:0 0 auto; flex-wrap:wrap; justify-content:flex-end; }
    @keyframes error-banner-in { from { opacity:0; transform:translateY(-10px); } to { opacity:1; transform:translateY(0); } }
    .module-complete.done { background:var(--green-soft); border-color:#bfe3d2; }
    .module-complete.done strong { color:#216b4f; }
    .sentence { border: 0; padding: 5px 7px; background: transparent; color: inherit; font: inherit; text-align: left; border-radius: 9px; }
    .sentence.current { background: #e7f0ff; color: #245a9e; }
    .reading-sentence { display: block; margin: 0 0 13px; }
    .sentence-line { display: grid; grid-template-columns: 34px minmax(0,1fr) auto; gap: 10px; align-items: start; }
    .sentence-controls { display: contents; }
    .sentence-content { min-width: 0; }
    .reading-sentence .sentence { display: block; width: 100%; }
    .sentence-speaker, .translation-toggle { display: inline-grid; place-items: center; align-self: start; flex: 0 0 auto; border: 0; border-radius: 8px; background: transparent; color: var(--blue); cursor: pointer; }
    .sentence-speaker { width: 34px; height: 30px; margin-top: 12px; padding: 6px; }
    .sentence-speaker:hover, .translation-toggle:hover { border-color: #9fbde8; background: var(--blue-soft); }
    .sentence-speaker svg { width: 16px; height: 16px; fill: currentColor; }
    .translation-row { display: contents; }
    .translation-toggle { min-height: 28px; margin-top: 12px; padding: 4px 2px; color: var(--muted); font-size: 12px; font-weight: 800; white-space: nowrap; }
    .translation-toggle[aria-expanded="true"] { color: var(--blue); }
    .full-translate { grid-column: 1 / -1; padding: 12px 16px; border-top: 1px solid var(--line); }
    .full-translate-panel { margin-top: 10px; padding: 12px 14px; border-radius: 12px; background: var(--surface-subtle); }
    .ft-zh { margin: 0; color: var(--ink); font-size: 14px; line-height: 1.8; }
    .lookup-word { cursor: pointer; border-radius: 6px; }
    .lookup-word:hover { background: #cfe0fa; box-shadow: 0 0 0 3px #cfe0fa; }
    .lookup-pop { position: fixed; z-index: 100; width: 240px; padding: 12px 14px; border-radius: 12px; background: #fff; border: 1px solid var(--line); box-shadow: 0 10px 30px rgba(25,54,88,.16); font-size: 14px; color: var(--ink); }
    .lookup-pop strong { display: block; font-size: 16px; font-weight: 900; }
    .lookup-pop em { display: block; margin-top: 2px; color: var(--muted); font-style: normal; font-size: 13px; }
    .lookup-pop p { margin: 8px 0 0; line-height: 1.5; }
    .lookup-pop .lookup-tag { display: inline-block; margin-top: 6px; padding: 2px 8px; border-radius: 999px; background: var(--blue-soft); color: var(--blue); font-size: 11px; font-weight: 800; }
    .lookup-loading { color: var(--muted); font-size: 13px; }
    .sentence-translation { display: block; margin-top: 4px; color: var(--muted); font-size: .62em; font-weight: 550; line-height: 1.45; }
    .sentence-translation.is-hidden { visibility: hidden; }
    .listen-stage { padding: 0; }
    .listen-stage .section-title { margin-bottom: 10px; }
    .player { display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center; padding: 14px 16px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface-subtle); color: var(--ink); }
    .player-main { min-width: 0; }
    .player-top { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
    .player-status { font-size: 15px; font-weight: 850; }
    .play-round { display: grid; place-items: center; width: 54px; height: 54px; border: 0; border-radius: 50%; background: var(--blue); color: #fff; font-size: 22px; line-height: 1; font-weight: 900; cursor: pointer; box-shadow: 0 6px 16px rgba(57,121,216,.32); transition: background-color .16s ease, transform .16s ease, box-shadow .16s ease; }
    .play-round:hover { background: #4d8ae0; transform: translateY(-1px); box-shadow: 0 8px 20px rgba(57,121,216,.38); }
    .play-round:active { transform: translateY(0) scale(.95); }
    .play-round svg { display: block; width: 22px; height: 22px; fill: currentColor; }
    .play-round .pi-play { transform: translateX(-1px); }
    .speed-control { display: flex; align-items: center; gap: 8px; }
    .speed-control label { color: var(--muted); font-size: 12px; font-weight: 750; white-space: nowrap; }
    .speed-slider { width: 108px; height: 4px; margin: 0; appearance: none; border-radius: 999px; outline: none; background: linear-gradient(to right,#3979d8 0%,#3979d8 var(--speed-fill,80%),#d8e2ec var(--speed-fill,80%),#d8e2ec 100%); cursor: pointer; }
    .speed-slider::-webkit-slider-runnable-track { height: 4px; border-radius: 999px; background: transparent; }
    .speed-slider::-webkit-slider-thumb { width: 14px; height: 14px; margin-top: -5px; border: 2px solid #fff; border-radius: 50%; background: #3979d8; box-shadow: 0 1px 4px rgba(25,54,88,.22); appearance: none; }
    .speed-slider::-moz-range-track { height: 4px; border-radius: 999px; background: transparent; }
    .speed-slider::-moz-range-progress { height: 4px; border-radius: 999px; background: #3979d8; }
    .speed-slider::-moz-range-thumb { width: 10px; height: 10px; border: 2px solid #fff; border-radius: 50%; background: #3979d8; box-shadow: 0 1px 4px rgba(25,54,88,.22); }
    .speed-slider:focus-visible { outline: 2px solid rgba(57,121,216,.5); outline-offset: 3px; }
    .speed-value { min-width: 36px; color: var(--blue); font-size: 13px; font-weight: 850; text-align: right; }
    .playback-seek { display: block; width: 100%; height: 6px; margin: 12px 0 0; appearance: none; border-radius: 999px; outline: none; background: linear-gradient(to right,#3979d8 0%,#3979d8 var(--seek-fill,0%),#e7edf3 var(--seek-fill,0%),#e7edf3 100%); cursor: pointer; }
    .playback-seek::-webkit-slider-runnable-track { height: 6px; border-radius: 999px; background: transparent; }
    .playback-seek::-webkit-slider-thumb { width: 14px; height: 14px; margin-top: -4px; border: 2px solid #fff; border-radius: 50%; background: #3979d8; box-shadow: 0 1px 4px rgba(25,54,88,.22); appearance: none; }
    .playback-seek::-moz-range-track { height: 6px; border-radius: 999px; background: transparent; }
    .playback-seek::-moz-range-progress { height: 6px; border-radius: 999px; background: #3979d8; }
    .playback-seek::-moz-range-thumb { width: 10px; height: 10px; border: 2px solid #fff; border-radius: 50%; background: #3979d8; box-shadow: 0 1px 4px rgba(25,54,88,.22); }
    .playback-seek:focus-visible { outline: 2px solid rgba(57,121,216,.5); outline-offset: 3px; }
    .playback-meta { display: flex; justify-content: space-between; gap: 12px; margin-top: 6px; color: var(--muted); font-size: 12px; font-weight: 700; }
    .practice-card-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 18px; align-items: start; }
    .record-box { padding: 14px 16px; border: 0; border-radius: 16px; background: #fff; box-shadow: 0 4px 18px rgba(25,54,88,.07); }
    .record-box.recording { border-color: var(--brand); background: #fff8f5; }
    .record-box.complete { background: #fff; }
    .practice-card-number { margin-bottom: 6px; color: var(--muted); font-size: 12px; font-weight: 850; }
    .practice-sentence-row { display: flex; align-items: center; gap: 10px; }
    .practice-sentence-controls { display: grid; gap: 12px; justify-items: end; }
    .practice-sentence-actions { flex-wrap: nowrap; justify-content: flex-end; }
    .practice-recording-result { margin-top: 12px; }
    .record-box blockquote { flex: 1; min-width: 0; margin: 0; padding: 10px 12px; border-radius: 10px; background: #eef3f8; font-size: 19px; font-weight: 800; line-height: 1.55; }
    .record-box audio { width: min(100%,320px); }
    .score-result { position: relative; margin-top: 10px; padding: 10px 12px; border-radius: 14px; background: linear-gradient(160deg,#fff 55%,#fff7f2); border: 1px solid #f0dcd0; box-shadow: 0 6px 18px rgba(239,114,89,.08); overflow: hidden; }
    .score-result.loading { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; font-weight: 750; }
    .ai-thinking { font-size: 22px; animation: bounce .8s ease-in-out infinite; }
    @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    .dots { display: inline-flex; gap: 2px; margin-left: 2px; }
    .dots i { width: 3px; height: 3px; border-radius: 50%; background: currentColor; animation: blink 1s infinite; }
    .dots i:nth-child(2){ animation-delay: .2s; }
    .dots i:nth-child(3){ animation-delay: .4s; }
    @keyframes blink { 0%,80%,100% { opacity: .25; } 40% { opacity: 1; } }
    .ai-details .score-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .ai-details .score-ring { position: relative; display: grid; place-items: center; width: 58px; height: 58px; flex: 0 0 auto; border-radius: 50%; background: conic-gradient(var(--green) calc(var(--score,0)*1%), #e7edf3 0); box-shadow: inset 0 0 0 1px rgba(255,255,255,.6); }
    .ai-details .score-ring::before { content: ''; position: absolute; inset: 5px; border-radius: 50%; background: #fff; box-shadow: 0 2px 8px rgba(25,54,88,.08); }
    .ai-details .score-ring span { position: relative; z-index: 1; font-size: 17px; font-weight: 900; color: var(--ink); }
    .ai-details .score-ring span b { font-weight: 900; }
    .ai-details .score-ring span i { font-style: normal; font-size: 10px; margin-left: 1px; color: var(--muted); }
    .ai-details .score-copy { flex: 1; min-width: 0; }
    .ai-details .score-stars { margin-bottom: 2px; font-size: 13px; letter-spacing: 2px; line-height: 1; color: #f2b64a; }
    .ai-details .score-stars i { font-style: normal; display: inline-block; animation: star-pop .45s cubic-bezier(.2,.8,.2,1) both; }
    .ai-details .score-stars i:nth-child(2){ animation-delay: .15s; }
    .ai-details .score-stars i:nth-child(3){ animation-delay: .3s; }
    .ai-details .score-stars i.star-dim { color: #e0e7ef; }
    @keyframes star-pop { 0% { transform: scale(0) rotate(-30deg); } 70% { transform: scale(1.3) rotate(8deg); } 100% { transform: scale(1) rotate(0); } }
    .ai-details .score-copy strong { display: block; font-size: 13px; font-weight: 850; }
    .ai-details .score-words { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .ai-details .word-chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 800; }
    .ai-details .word-chip i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
    .ai-details .word-chip em { font-style: normal; font-size: 11px; opacity: .78; font-weight: 750; }
    @keyframes chip-pop { from { opacity: 0; transform: translateY(6px) scale(.85); } to { opacity: 1; transform: translateY(0) scale(1); } }
    .ai-details .word-chip.ok { background: var(--green-soft); color: #1e6b4c; }
    .ai-details .word-chip.low { background: #fff5db; color: #946610; }
    .ai-details .word-chip.wrong { background: var(--red-soft); color: #8e3030; }
    .ai-details .word-chip.missing { background: #eef1f5; color: #687b92; }
    .ai-details .ai-teacher { display: flex; gap: 8px; align-items: flex-start; margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--line); }
    .ai-details .ai-avatar { display: grid; place-items: center; width: 28px; height: 28px; flex: 0 0 auto; border-radius: 50%; background: linear-gradient(140deg,#ffe3b8,#f6c46a); font-size: 15px; box-shadow: 0 4px 10px rgba(242,182,74,.3); animation: bounce 2.4s ease-in-out infinite; }
    .ai-details .ai-bubble { min-width: 0; padding: 10px 12px; border-radius: 12px; background: #fffaf2; border: 1px solid #f3e2c8; }
    .ai-details .ai-bubble strong { display: block; font-size: 11px; color: #b07f2a; letter-spacing: .04em; margin-bottom: 2px; }
    .ai-details .ai-bubble span { display: block; color: var(--ink); font-size: 12px; font-weight: 650; line-height: 1.5; }
    .ai-details .ai-advice { display: block; margin-top: 5px; color: var(--muted); font-size: 13px; font-weight: 650; line-height: 1.5; }
    .ai-details .confetti { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
    .ai-details .confetti i { position: absolute; top: -12px; width: 8px; height: 8px; border-radius: 2px; animation: confetti-fall 2.2s ease-in forwards; }
    @keyframes confetti-fall { to { transform: translateY(130px) rotate(360deg); opacity: 0; } }
    .record-eq { display: inline-flex; gap: 3px; align-items: flex-end; height: 16px; }
    .record-eq span { width: 3px; height: 16px; border-radius: 2px; background: var(--brand); transform-origin: bottom; animation: eq .9s ease-in-out infinite; }
    .record-eq span:nth-child(2){ animation-delay: .15s; }
    .record-eq span:nth-child(3){ animation-delay: .3s; }
    .record-eq span:nth-child(4){ animation-delay: .45s; }
    @keyframes eq { 0%,100% { transform: scaleY(.3); } 50% { transform: scaleY(1); } }
    .record-box.recording [data-record-sentence] { animation: pulse 1.2s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(244,123,99,.4); } 50% { box-shadow: 0 0 0 9px rgba(244,123,99,0); } }
    .voice-bar { display: flex; align-items: center; gap: 10px; margin-top: 10px; padding: 10px 14px; border-radius: 14px; background: linear-gradient(135deg,#5eb7ff,#3b8ef0); color: #fff; cursor: pointer; box-shadow: 0 6px 16px rgba(59,142,240,.28); min-height: 44px; transition: filter .16s ease; }
    .voice-bar:hover { filter: brightness(1.06); }
    .voice-bar.empty { background: linear-gradient(135deg,#e4f0ff,#cfe4ff); color: #2f6db3; box-shadow: none; }
    .voice-bar .voice-mic { font-size: 16px; }
    .voice-bar .voice-empty-text { font-weight: 750; font-size: 13px; }
    .voice-play { display: grid; place-items: center; width: 32px; height: 32px; flex: 0 0 auto; border: 0; border-radius: 50%; background: rgba(255,255,255,.28); color: #fff; font-size: 13px; cursor: pointer; }
    .voice-wave { display: flex; align-items: center; gap: 2px; flex: 1; min-width: 0; height: 22px; }
    .voice-wave i { width: 3px; border-radius: 2px; background: rgba(255,255,255,.45); height: 5px; transition: background-color .1s ease; }
    .voice-wave i.played { background: #fff; }
    .voice-wave i.played { background: #fff; }
    @keyframes wave { 0%,100% { transform: scaleY(.35); } 50% { transform: scaleY(1); } }
    .voice-time { font-size: 12px; font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .voice-score { padding: 3px 10px; border-radius: 999px; background: #fff; font-size: 13px; font-weight: 900; white-space: nowrap; box-shadow: 0 2px 6px rgba(0,0,0,.12); }
    .voice-score i { font-style: normal; font-size: 10px; margin-left: 1px; }
    .voice-score.high { color: #2f8b68; }
    .voice-score.mid { color: #b07f2a; }
    .voice-score.low { color: #c94d4d; }
    .voice-bar.recording { background: linear-gradient(135deg,#6fc1ff,#3b8ef0); }
    .rec-dot { width: 10px; height: 10px; flex: 0 0 auto; border-radius: 50%; background: #fff; }
    .rec-timer { color: #fff; font-size: 14px; font-weight: 850; font-variant-numeric: tabular-nums; }
    .rec-label { font-size: 11px; opacity: .85; font-weight: 700; white-space: nowrap; }
    .voice-stop { flex: 0 0 auto; padding: 5px 12px; border-radius: 999px; background: #fff; color: #d64545; font-size: 12px; font-weight: 850; white-space: nowrap; box-shadow: 0 2px 6px rgba(0,0,0,.12); }
    .voice-actions { margin-top: 10px; display: flex; justify-content: flex-end; }
    .practice-sentence-row .btn { flex: 0 0 auto; white-space: nowrap; }
    .practice-sentence-row .btn.demo { background: var(--blue-soft); color: var(--blue); border-color: transparent; }
    .voice-rerecord { flex: 0 0 auto; border: 1px solid rgba(255,255,255,.7); border-radius: 999px; padding: 4px 12px; background: rgba(255,255,255,.18); color: #fff; font-size: 12px; font-weight: 850; cursor: pointer; }
    .ai-details { position: relative; overflow: hidden; margin-top: 8px; border: 0; border-radius: 12px; background: var(--surface-subtle); }
    .ai-details summary { display: flex; align-items: center; gap: 8px; padding: 10px 12px; cursor: pointer; font-size: 13px; font-weight: 850; color: var(--ink); list-style: none; user-select: none; }
    .ai-details summary::-webkit-details-marker { display: none; }
    .ai-details summary::after { content: '（点击收起）'; margin-left: auto; color: var(--muted); font-size: 11px; font-weight: 700; }
    .ai-details:not([open]) summary::after { content: '（点击展开）'; }
    .ai-details .ai-body { padding: 0 12px 12px; }
    .ai-note { margin: 10px 0 0; }
    .ai-note strong { display: block; font-size: 13px; font-weight: 850; }

    .feedback { margin-top: 8px; font-size: 13px; font-weight: 800; }
    .rebuild-list { display: grid; gap: 8px; margin: 14px 0; }

    .rebuild-canvas,.rebuild-bank { min-width:0; padding:14px; border:0; border-radius:14px; background:linear-gradient(180deg,var(--blue-soft) 0%,#e3edf9 100%); box-shadow:0 10px 26px rgba(57,121,216,.10); }
    .rebuild-canvas.correct,.rebuild-bank.correct,.rebuild-choice-bank.correct,.rebuild-table-wrap.correct { background:linear-gradient(180deg,var(--green-soft) 0%,#eef9f4 100%); box-shadow:0 12px 28px rgba(47,139,104,.14); }
    .rebuild-canvas.wrong,.rebuild-bank.wrong,.rebuild-choice-bank.wrong,.rebuild-table-wrap.wrong { background:linear-gradient(180deg,var(--red-soft) 0%,#fff6f4 100%); box-shadow:0 12px 28px rgba(201,77,77,.12); }
    .rebuild-panel-title { margin:0 0 10px; color:var(--muted); font-size:12px; font-weight:850; letter-spacing:.03em; }

    .rebuild-slot { position:relative; display:grid; grid-template-columns:28px minmax(0,1fr) auto; gap:8px; align-items:center; min-height:58px; padding:8px; border:1px dashed #9eb2c9; border-radius:11px; background:#fff; transition:border-color .16s ease,background-color .16s ease,transform .16s ease; }
    .rebuild-slot.empty { color:var(--muted); background:rgba(255,255,255,.5); }

    .rebuild-slot-number { display:grid; place-items:center; width:26px; height:26px; border-radius:8px; background:var(--blue-soft); color:var(--blue); font-size:12px; font-weight:900; }

    .rebuild-option { display:flex; align-items:center; gap:8px; min-height:48px; padding:10px; border:1px solid var(--line); border-radius:10px; background:#fff; cursor:grab; font-size:13px; font-weight:750; }

    .rebuild-option.selected { border-color:var(--blue); background:var(--blue-soft); color:var(--blue); box-shadow:0 0 0 3px rgba(57,121,216,.12); }
    .rebuild-option.dragging { opacity:.45; }
    .rebuild-option small { margin-left:auto; color:var(--muted); font-size:11px; font-weight:700; white-space:nowrap; }

    .rebuild-table th { padding:13px 14px; background:var(--blue-soft); color:var(--blue); font-size:13px; text-align:left; }

    .rebuild-choice-bank { margin:16px 0 12px; padding:14px; border:0; border-radius:14px; background:linear-gradient(180deg,var(--blue-soft) 0%,#e3edf9 100%); box-shadow:0 10px 26px rgba(57,121,216,.10); transition:box-shadow .2s ease,background .2s ease; }
    .rebuild-choice-bank-title { margin:0 0 10px; color:var(--muted); font-size:12px; font-weight:850; }

    .rebuild-table-option:active { cursor:grabbing; }
    .rebuild-table-option.selected { background:#dcecff; box-shadow:0 0 0 3px rgba(57,121,216,.15); }
    .rebuild-table-option.used { border-color:#b8c7d8; background:#f2f5f8; color:#64788e; }

    @media(max-width:560px){.player{padding:13px 14px}.player-top{flex-direction:column;align-items:flex-start;gap:10px}.speed-control{width:100%}.speed-slider{flex:1;width:auto}}

<body>
  <div class="shell">
    <div id="nav"></div>
    <div id="errorBanner" class="error-banner hidden" role="alert" aria-live="assertive"></div>
    <section id="loading" class="panel state-box"><strong>正在准备学习卡片…</strong>图片、正文和练习很快就好。</section>
    <div id="app" class="hidden">
      <section class="panel lesson-head">
        <div><div class="lesson-meta" id="meta"></div><h1 id="title"></h1><p id="bigQuestionLabel" class="muted"></p></div>
        <div><div class="muted" id="progressLabel">0 / 4 模块完成</div><div class="progress" style="width:190px;margin-top:7px"><span id="topProgress"></span></div></div>
      </section>
      <nav class="panel module-nav" id="moduleNav" aria-label="学习模块"></nav>
      <main class="workspace">
        <section class="module" data-module="reading" id="readingModule"></section>
        <section class="module" data-module="words" id="wordsModule"></section>
        <section class="module" data-module="comprehension" id="comprehensionModule"></section>
        <section class="module" data-module="rebuild" id="rebuildModule"></section>
      </main>
    </div>
  </div>
  <script type="module">
    import { $, $$, api, currentUserId, escapeHtml, nav, speak, toast, formatDate } from '/shared.js';
    $('#nav').innerHTML = nav();
    const lessonApp=$('#app');if(lessonApp){lessonApp.addEventListener('contextmenu',e=>e.preventDefault());}
    const modules = [
      ['reading','Listen and Read','阅读与练习',['reading','listening']],['words','Words','核心词'],
      ['comprehension','Comprehension',''],['rebuild','Rebuild','重建']
    ];
    const state = { card:null, active:'reading', rate:1, current:-1, playbackProgress:0, speechToken:0, singlePlaying:false, previewIndex:null, dragWasPlaying:false, resumePosition:null, practiceCurrent:-1, playing:false, wordBankReviewed:false, selectedWord:null, selectedMeaning:null, selectedMeaningAnswer:null, matched:[], matchWrong:[], matchWrongTimer:null, matchSuccess:[], matchSuccessTimer:null, newMatchWord:null, matchAnimationWord:null, wordTileOrder:[], wordTileSelected:null, wordTileMatched:[], wordTileSide:[], wordTileFeedback:[], wordTileLocked:false, wordTileTimer:null, wordTileCombo:0, wordTileCelebration:null, wordTileBurstShown:false, wordTileSequence:0, wordTileNewSide:null, context:{}, contextSelected:null, contextChecked:false, contextWrong:[], contextReturned:[], contextFeedbackTimer:null, autoCheckTimer:null, contextJustCorrect:null, contextShake:false, translationsVisible:{}, fullTranslateOpen:false, comprehension:{}, comprehensionChecked:false, compCheckTimer:null, compFeedbackAnim:false, rebuild:[], rebuildSelected:null, rebuildBankOrder:[], rebuildChecked:false, rebuildCheckTimer:null, rebuildFeedbackAnim:false, moduleStatus:{}, previousLesson:null, nextLesson:null, recording:null, recordingIndex:-1, recordingStartedAt:null, recordingTimer:null, recordingUrls:{}, recordingDataUrls:{}, recordingBlobs:{}, submittedPractice:[],scoring:{},scores:{},unrecognized:{} };
    let wordTileAudioContext=null;
    const SCORE_ENDPOINT=(location.hostname==='localhost'||location.hostname==='127.0.0.1')?'http://127.0.0.1:8787/score':'/api/score';
    const slug = location.pathname.startsWith('/lesson/') ? decodeURIComponent(location.pathname.split('/').filter(Boolean).pop()) : new URLSearchParams(location.search).get('lesson') || 'day001-seed';
    const ERROR_LOG_LIMIT=60;
    const lastErrorShown={};
    function readErrorLog(){try{const raw=localStorage.getItem(`fsr:error-log:${currentUserId()}`);const value=raw?JSON.parse(raw):[];return Array.isArray(value)?value:[];}catch{return [];}}
    function appendErrorLog(entry){const log=readErrorLog();log.push({time:new Date().toISOString(),...entry});const trimmed=log.slice(-ERROR_LOG_LIMIT);try{localStorage.setItem(`fsr:error-log:${currentUserId()}`,JSON.stringify(trimmed));}catch{}return trimmed;}
    function errorText(entry){return `[${entry.time}] ${entry.source||'页面'}｜${entry.title||'错误'}：${entry.message||''}${entry.detail?`（${entry.detail}）`:''}`;}
    function showError({title='操作失败',message='请稍后再试。',detail='',source='页面',retry=null}={}){
      const normalized=String(message||'').trim()||'请稍后再试。';
      const log=appendErrorLog({title,message:normalized,detail,source});
      const now=Date.now(),key=`${source}|${title}`;if(lastErrorShown[key]&&now-lastErrorShown[key]<5000)return;lastErrorShown[key]=now;
      const banner=$('#errorBanner');if(!banner)return;
      const copyText=log.slice(-5).map(errorText).join('\n');
      banner.innerHTML=`<div class="error-banner-copy"><strong>${escapeHtml(title)}</strong><p>${escapeHtml(normalized)}</p><small>${escapeHtml(detail||`来源：${source} · 已记录到本地错误日记`)}</small></div><div class="error-banner-actions">${retry?`<button class="btn" id="errorRetry" type="button">重试</button>`:''}<button class="link-btn" id="errorCopy" type="button">复制错误信息</button><button class="link-btn" id="errorClose" type="button">关闭</button></div>`;
      banner.classList.remove('hidden');
      const close=$('#errorClose');if(close)close.onclick=()=>banner.classList.add('hidden');
      const copy=$('#errorCopy');if(copy)copy.onclick=async()=>{try{await navigator.clipboard.writeText(copyText);copy.textContent='已复制';setTimeout(()=>copy.textContent='复制错误信息',1800);}catch{const ta=document.createElement('textarea');ta.value=copyText;document.body.append(ta);ta.select();document.execCommand('copy');ta.remove();copy.textContent='已复制';}};
      const retryBtn=$('#errorRetry');if(retryBtn)retryBtn.onclick=()=>{banner.classList.add('hidden');retry();};
    }
    window.addEventListener('unhandledrejection',event=>showError({title:'运行错误',message:event.reason?.message||'页面出现未处理的错误。',detail:event.reason?.stack||'',source:'运行'}));
    const sentences = () => (state.card.paragraphs || []).flatMap(p => typeof p === 'string' ? (p.match(/[^.!?]+[.!?]+/g) || [p]) : (p.sentences || []).map(s => s.text || s));
    const practiceSentences = () => state.card.listenRead?.sentences?.length ? state.card.listenRead.sentences : sentences().slice(0,2).map((sentence,index)=>({sentence,role:index?'Structure':'Science Core'}));
    const practiceDemoIndex = item => {
      const text = String(typeof item === 'string' ? item : item?.sentence || '').replace(/\s+/g, ' ').trim();
      const all = sentences();
      for (let i = 0; i < all.length; i++) {
        if (String(all[i]).replace(/\s+/g, ' ').trim() === text) return i;
      }
      return -1;
    };
    const words = () => state.card.word_bank || [];
    const contextQuestions = () => state.card.wordModule?.contextQuestions || [];
    const compQuestions = () => state.card.comprehension?.questions || [];
    const rebuildSteps = () => state.card.rebuild?.steps || [];
    const isDone = name => Boolean(typeof state.moduleStatus[name] === 'object' ? state.moduleStatus[name].completed : state.moduleStatus[name]);
    const scoreOf = name => Number(typeof state.moduleStatus[name] === 'object' ? state.moduleStatus[name].score || 0 : 0);
    const completedCount = () => modules.filter(([id,,,members=[id]]) => members.every(isDone)).length;

    function highlightSentence(text, index, translation) {
      const visible = Boolean(state.translationsVisible[index]);
      const words = String(text).split(/(\s+)/).map(part => {
        if (!part.trim()) return escapeHtml(part);
        const word = part.replace(/[^A-Za-z'-]/g, '').toLowerCase();
        return `<span class="lookup-word" data-word="${escapeHtml(word)}" data-sentence-index="${index}">${escapeHtml(part)}</span>`;
      }).join('');
      return `<span class="sentence-line"><span class="sentence-controls"><button type="button" class="sentence-speaker" data-sentence="${index}" aria-label="播放句子 ${index+1}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4Zm11.5-.5a1 1 0 0 0-1.4 1.4A4.97 4.97 0 0 1 15.5 12c0 .83-.2 1.6-.55 2.1a1 1 0 1 0 1.4 1.4A6.96 6.96 0 0 0 17.5 12c0-1.34-.38-2.58-1-3.5Zm2.8-2.3a1 1 0 0 0-1.4 1.4A7.97 7.97 0 0 0 18.5 12c0 1.67-.5 3.2-1.35 4.4a1 1 0 1 0 1.4 1.4A9.97 9.97 0 0 0 20.5 12c0-2.1-.65-4.05-1.8-5.8Z"/></svg></button></span><span class="sentence-content"><span class="sentence ${(state.previewIndex ?? state.current) === index ? 'current' : ''}" data-sentence-index="${index}">${words}</span><small class="sentence-translation ${visible?'':'is-hidden'}" aria-label="中文翻译">${escapeHtml(translation || '暂无中文翻译')}</small></span><span class="translation-row"><button type="button" class="translation-toggle" data-translation="${index}">${visible?'收起':'翻译'}</button></span></span>`;
    }

    function sentenceTranslation(paragraph, sentence, sentenceIndex, globalIndex) {
      if (typeof paragraph === 'object') {
        const item = paragraph.sentences?.[sentenceIndex];
        if (item && typeof item === 'object') return item.translation || item.chinese || item.zh || '';
        return paragraph.translations?.[sentenceIndex] || '';
      }
      const translations = state.card.translations || state.card.paragraphTranslations;
      return translations?.[globalIndex] || ({
        'A flower starts as a tight bud.':'花朵从一个紧实的花蕾开始。',
        'Roots take in water from the soil.':'根从土壤中吸收水分。',
        'Warm sunlight helps the stem and petals grow.':'温暖的阳光帮助茎和花瓣生长。',
        'The petals slowly unfold and open.':'花瓣慢慢展开并开放。',
        'Now the bloom can catch light and welcome bees.':'现在花朵可以接收阳光并迎来蜜蜂。',
        'A cactus lives in a hot, dry desert.':'仙人掌生活在炎热干燥的沙漠中。',
        'Its thick stem stores water for a long time.':'它粗厚的茎能长时间储存水分。',
        'A waxy skin keeps water from escaping.':'蜡质表皮防止水分流失。',
        'Tiny spines protect the plant from hungry animals.':'细小的刺保护植物免受饥饿动物的伤害。',
        'These features help the cactus survive with very little rain.':'这些特征帮助仙人掌在少雨的环境中生存。'
      })[sentence] || '';
    }

    function renderNav() {

    async function lookupWord(word,el){

    function playSingleSentence(index) {
      const text = sentences()[index];
      if (!text) return;
      if (audioEnabled()) { playAudioSentence(index); return; }
      if (state.playing) pausePlayback();   // 全文朗读在播：先停在当前位置
      speechSynthesis.cancel();
      const token = ++state.speechToken;
      state.playing = false;
      state.singlePlaying = true;
      state.previewIndex = index;           // 仅试听，进度条不动
      renderReading();
      speak(text, state.rate, () => {
        if (token !== state.speechToken) return;
        state.singlePlaying = false;
        state.previewIndex = null;
        renderReading();
      });
    }

    let playbackOnfinish = null;
    function startPlayback(startIndex) {
      speechSynthesis.cancel();
      const token = ++state.speechToken;
      state.singlePlaying = false;
      state.playing = true;
      state.previewIndex = null;
      let i = startIndex;
      const total = sentences().length;
      const next=()=>{ if(token!==state.speechToken)return; if(!state.playing||i>=total){state.playing=false;state.current=-1;state.playbackProgress=100;state.resumePosition=null;renderReading();const done=playbackOnfinish;playbackOnfinish=null;done?.();return;} state.current=i; state.playbackProgress=Math.round((i/Math.max(total,1))*100); renderReading(); const sentenceIndex=i++; speak(sentences()[sentenceIndex],state.rate,()=>{if(token===state.speechToken)setTimeout(()=>{if(token===state.speechToken)next();},600);},event=>{if(token!==state.speechToken||event.name!=='word')return;const ratio=(event.charIndex||0)/Math.max(sentences()[sentenceIndex].length,1);state.playbackProgress=Math.min(99,Math.round(((sentenceIndex+ratio)/Math.max(total,1))*100));const seek=$('#playbackSeek');if(seek){seek.value=Math.round(state.playbackProgress*10);seek.style.setProperty('--seek-fill',`${state.playbackProgress}%`);}const meta=$('.playback-meta span:last-child');if(meta)meta.textContent=`${state.playbackProgress}%`;}); };
      next();
    }
    function pausePlayback() {
      ++state.speechToken;
      speechSynthesis.cancel();
      state.playing = false;
      state.singlePlaying = false;
      state.previewIndex = null;
      playbackOnfinish = null;
      if (state.current >= 0) {
        state.resumePosition = (state.current / Math.max(sentences().length, 1)) * 100;
        state.playbackProgress = Math.round(state.resumePosition);
      }
      renderReading();
    }
    function playAll(onfinish) {
      if (state.playing) { if (audioEnabled()) pauseAudioPlayback(); else pausePlayback(); return; }
      playbackOnfinish = onfinish || null;
      const total = sentences().length;
      const done = state.playbackProgress >= 100;
      const position = done ? 0 : ((state.resumePosition ?? state.playbackProgress) / 100) * total;
      const start = Math.min(total - 1, Math.floor(position));
      const fraction = done ? 0 : position - start;
      state.resumePosition = null;
      if (audioEnabled()) startAudioPlayback(start, fraction);
      else startPlayback(start);
    }
    function seekTo(ratio) {
      const total = sentences().length; if (!total) return;
      const position = Math.max(0, Math.min(1, ratio)) * total;
      const index = Math.min(total - 1, Math.floor(position));
      const wasPlaying = state.dragWasPlaying;
      state.dragWasPlaying = false;
      if (wasPlaying) {
        startPlayback(index);
      } else {
        ++state.speechToken;
        speechSynthesis.cancel();
        state.playing = false;
        state.singlePlaying = false;
        state.current = index;
        state.resumePosition = Math.max(0, Math.min(1, ratio)) * 100;
        state.playbackProgress = Math.round(state.resumePosition);
        renderReading();
      }
    }
    function updatePlaybackUI(index, total, ratio) {
      $$('.sentence[data-sentence-index]').forEach(node => node.classList.toggle('current', Number(node.dataset.sentenceIndex) === index));
      const first = $('.playback-meta span:first-child'); if (first) first.textContent = index >= 0 ? `第 ${index + 1} / ${total} 句` : '准备播放';
      const last = $('.playback-meta span:last-child'); if (last) last.textContent = `${Math.round(ratio * 100)}%`;
      const seek = $('#playbackSeek'); if (seek) { seek.value = Math.round(ratio * 1000); seek.style.setProperty('--seek-fill', `${Math.round(ratio * 100)}%`); }
    }
    let audioManifest = null;
    let currentAudio = null;
    const audioPool = {};
    const audioEnabled = () => audioManifest && Array.isArray(audioManifest.sentences) && audioManifest.sentences.length === sentences().length;
    const audioFileFor = index => (audioManifest?.sentences?.[index]?.file) || `${String(index + 1).padStart(2, '0')}.mp3`;
    const audioUrlFor = index => `/audio/${encodeURIComponent(slug)}/${audioFileFor(index)}`;
    const audioFor = index => {
      if (!audioPool[index]) {
        const audio = new Audio();
        audio.preload = 'auto';
        audio.src = audioUrlFor(index);
        audioPool[index] = audio;
      }
      return audioPool[index];
    };
    function stopAllAudio() {
      Object.values(audioPool).forEach(audio => { try { audio.pause(); } catch {} });
      currentAudio = null;
    }
    async function loadAudioManifest() {
      try {
        const res = await fetch(`/audio/${encodeURIComponent(slug)}/manifest.json`);
        if (!res.ok) return;
        audioManifest = await res.json();
      } catch { audioManifest = null; }
    }
    function updateAudioProgress(index, total, audio) {
      const duration = audio.duration || 0;
      const fraction = duration ? Math.min(1, audio.currentTime / duration) : 0;
      state.playbackProgress = Math.min(Math.round(((index + fraction) / total) * 100), 99);
      const seek = $('#playbackSeek');
      if (seek) { seek.value = Math.round(state.playbackProgress * 10); seek.style.setProperty('--seek-fill', `${state.playbackProgress}%`); }
      const last = $('.playback-meta span:last-child');
      if (last) last.textContent = `${state.playbackProgress}%`;
    }
    function startAudioPlayback(startIndex, fraction = 0) {
      stopAllAudio();
      const token = ++state.speechToken;
      state.singlePlaying = false;
      state.playing = true;
      state.previewIndex = null;
      const total = sentences().length;
      const playSequence = index => {
        if (token !== state.speechToken || !state.playing) return;
        if (index >= total) {
          state.playing = false;
          state.current = -1;
          state.playbackProgress = 100;
          state.resumePosition = null;
          renderReading();
          const done = playbackOnfinish; playbackOnfinish = null; done?.();
          return;
        }
        state.current = index;
        state.playbackProgress = (index === startIndex && fraction > 0)
          ? Math.round((index + fraction) / total * 100)
          : Math.round(index / total * 100);
        renderReading();
        const audio = audioFor(index);
        currentAudio = audio;
        audio.playbackRate = state.rate;
        audio.currentTime = 0;
        if (index === startIndex && fraction > 0) {
          const seekToFraction = () => { if (token === state.speechToken && audio.duration) audio.currentTime = Math.min(fraction * audio.duration, audio.duration - 0.05); };
          if (audio.readyState >= 1 && audio.duration) seekToFraction();
          else audio.onloadedmetadata = seekToFraction;
        }
        audio.ontimeupdate = () => { if (token === state.speechToken && state.playing) updateAudioProgress(index, total, audio); };
        audio.onended = () => { if (token !== state.speechToken || !state.playing) return; setTimeout(() => { if (token === state.speechToken && state.playing) playSequence(index + 1); }, 600); };
        audio.play().catch(() => { if (token === state.speechToken) playSequence(index + 1); });
      };
      playSequence(startIndex);
    }
    function playAudioSentence(index) {
      if (state.playing) pauseAudioPlayback();   // 全文朗读在播：先停在当前位置
      const token = ++state.speechToken;
      state.playing = false;
      state.singlePlaying = true;
      state.previewIndex = index;               // 仅试听，进度条不动
      renderReading();
      const audio = audioFor(index);
      currentAudio = audio;
      audio.playbackRate = state.rate;
      audio.currentTime = 0;
      audio.ontimeupdate = null;
      audio.onended = () => {
        if (token !== state.speechToken) return;
        state.singlePlaying = false;
        state.previewIndex = null;
        renderReading();
      };
      audio.play().catch(() => { state.singlePlaying = false; state.previewIndex = null; renderReading(); });
    }
    function pauseAudioPlayback() {
      const audio = currentAudio;
      const total = sentences().length;
      ++state.speechToken;
      if (audio && state.playing && total) {
        const duration = audio.duration || 0;
        const fraction = duration ? Math.min(1, audio.currentTime / duration) : 0;
        state.resumePosition = ((state.current + fraction) / total) * 100;
        state.playbackProgress = Math.round(state.resumePosition);
      }
      stopAllAudio();
      state.playing = false;
      state.singlePlaying = false;
      state.previewIndex = null;
      playbackOnfinish = null;
      renderReading();
    }
    function seekAudio(ratio) {
      const total = sentences().length; if (!total) return;
      const position = Math.max(0, Math.min(1, ratio)) * total;
      const index = Math.min(total - 1, Math.floor(position));
      const fraction = position - index;
      const wasPlaying = state.dragWasPlaying;
      state.dragWasPlaying = false;
      if (wasPlaying) {
        startAudioPlayback(index, fraction);
      } else {
        // 暂停状态下拖动：只移动位置，不自动播放
        ++state.speechToken;
        stopAllAudio();
        state.playing = false;
        state.singlePlaying = false;
        state.current = index;
        state.resumePosition = Math.max(0, Math.min(1, ratio)) * 100;
        state.playbackProgress = Math.round(state.resumePosition);
        renderReading();
      }
    }

      target.innerHTML=`<div class="listen-stage"><div class="player" aria-label="全文朗读播放控制"><button id="playAll" class="play-round" type="button" aria-label="${state.playing?'暂停全文朗读':(state.current>=0&&state.playbackProgress<100?'继续播放全文朗读':'播放全文朗读')}" title="${state.playing?'暂停':(state.current>=0&&state.playbackProgress<100?'继续播放':'播放全文朗读')}">${state.playing?'<svg class="pi pi-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h3v14H7zM14 5h3v14h-3z"/></svg>':'<svg class="pi pi-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>'}</button><div class="player-main"><div class="player-top"><strong class="player-status">${playbackStatus}</strong><div class="speed-control"><label for="speedSlider">语速</label><input id="speedSlider" class="speed-slider" style="--speed-fill:${rateFill}%" type="range" min="0.6" max="1.1" step="0.1" value="${rate}" aria-label="调整朗读倍速"><span class="speed-value" id="speedValue">${rate.toFixed(1)}x</span></div></div><input id="playbackSeek" class="playback-seek" type="range" min="0" max="1000" step="1" value="${Math.round(progress*10)}" style="--seek-fill:${progress}%" aria-label="朗读进度，可拖动跳转"><div class="playback-meta"><span>${state.current>=0?`第 ${state.current+1} / ${total} 句`:'准备播放'}</span><span>${progress}%</span></div></div></div></div>`;

      const seekBar=$('#playbackSeek');

    function scoreFeedbackHtml(result){
      const praise=result.overall>=85?'发音很标准，太棒了！':result.overall>=70?'大部分词都读对了，继续加油！':'别灰心，多听几遍示范再试一次！';
      const chips=result.words.map(w=>{
        const label=({ok:'读得好',low:'需改进',wrong:'读错',missing:'漏读'})[w.status]||'';
        const title=w.status==='wrong'?` title="读成了 ${escapeHtml(w.heard||'？')}"`:'';
        return `<span class="word-chip ${w.status}"${title}><i aria-hidden="true"></i>${escapeHtml(w.word)}<em>${label}</em></span>`;
      }).join('');
      return `<details class="ai-details" open><summary>AI 评价</summary><div class="ai-body"><div class="score-words">${chips}</div><p class="ai-note"><strong>${praise}</strong><span>${buildAdvice(result)}</span></p></div></details>`;
    }
    function buildAdvice(result){
      const okCount=result.words.filter(w=>w.status==='ok').length;
      const total=result.words.length;
      const items=[];
      for(const w of result.words){
        if(w.status==='wrong')items.push(`「${w.word}」可能读成了${w.heard?`「${w.heard}」`:'别的词'}`);
        else if(w.status==='low')items.push(`「${w.word}」发音可能还不够清楚`);
        else if(w.status==='missing')items.push(`「${w.word}」好像没有读出来`);
      }
      if(!items.length)return '每个词都读得很棒，继续保持！';
      const sentence=items.join('，');
      if(okCount===0)return `${sentence}。也可能只是识别没听清，跟着示范再读一遍试试吧！`;
      if(okCount/total>=0.6)return `${sentence}。其它词听起来都很棒！`;
      return `${sentence}。再听几遍示范，读慢一点可能会更清楚！`;
    }
    function confettiHtml(){

        bits+=`<i style="left:${(i*7+3)%95}%;background:${colors[i%colors.length]};animation-delay:${(i%4)*0.12}s"></i>`;
      }
      return `<span class="confetti" aria-hidden="true">${bits}</span>`;

    function toggleRecordPlay(i){

      const first=state.wordTileSelected;

      clearTimeout(state.wordTileTimer);
      if(firstPair===pair&&firstKind!==kind){
        const combo=state.wordTileCombo+1;

        state.wordTileCombo=combo;
        const item=wordTileWords().find(entry=>entry.index===pair);

        state.wordTileCelebration={stage:'show',item};

    function renderComprehension(){const qs=compQuestions();$('#comprehensionModule').innerHTML=`<div class="panel practice-shell"><div class="practice-intro"><div><h2 class="section-title task-title"><span class="task-tag">Task 4</span><span class="task-divider" aria-hidden="true"></span><span class="task-name">Comprehension</span></h2><p class="muted">阅读问题，选择最恰当的答案。</p></div><div class="intro-actions"><span class="badge">${Object.keys(state.comprehension).length} / ${qs.length} 已作答</span><button class="link-btn" id="retryComp" type="button">再试一次</button></div></div>${renderQuestions(qs,state.comprehension,'comp',state.comprehensionChecked)}</div>${moduleCompleteBox('comprehension')}`;$$('[data-answer-group="comp"]').forEach(button=>button.onclick=()=>{const index=button.dataset.question;const answer=button.dataset.answer;state.comprehension[index]=answer;if(state.comprehensionChecked){updateCompAnswer(index,answer);return;}state.comprehensionChecked=false;renderComprehension();saveProgress();if(qs.length&&Object.keys(state.comprehension).length>=qs.length){clearTimeout(state.compCheckTimer);state.compCheckTimer=setTimeout(checkComp,400);}});const retryBtn=$('#retryComp');if(retryBtn)retryBtn.onclick=()=>{state.comprehension={};state.comprehensionChecked=false;state.moduleStatus.comprehension={completed:false,score:0};renderComprehension();saveProgress();};bindNext();}

    function placeRebuildTableOption(optionId,slotId,kind,pairs){const tableState=state.rebuild;const wasChecked=state.rebuildChecked;const previousSlot=Object.keys(tableState.cells).find(key=>tableState.cells[key]===optionId);const displaced=tableState.cells[slotId]||null;if(previousSlot&&previousSlot!==slotId)tableState.cells[previousSlot]=displaced;tableState.cells[slotId]=optionId;tableState.selected=null;if(wasChecked){state.rebuildChecked=true;const changed=[slotId];if(previousSlot)changed.push(previousSlot);changed.forEach(id=>updateTableCellDom(id,pairs,tableState));syncTableOptions(pairs,tableState);finalizeRebuildScore(tableScore(pairs,tableState));}else{state.rebuildChecked=false;renderRebuildTable(kind);saveProgress();scheduleRebuildCheck();}}
    function tableScore(pairs,tableState){const correct=pairs.filter((_,row)=>{const hidden=tableState.reveals[row]==='left'?'right':'left',slotId=`${row}-${hidden}`;return tableState.cells[slotId]===slotId;}).length;return Math.round(correct/pairs.length*100);}
    function finalizeRebuildScore(score){state.moduleStatus.rebuild={completed:true,score,completedAt:new Date().toISOString()};$$('.rebuild-canvas,.rebuild-bank,.rebuild-choice-bank,.rebuild-table-wrap').forEach(node=>{node.classList.toggle('correct',score===100);node.classList.toggle('wrong',score<100);});const alert=document.querySelector('#rebuildModule .alert');if(alert){alert.classList.toggle('success',score===100);alert.classList.toggle('error',score<100);alert.textContent=score===100?'结构正确！你已经抓住了文章关系。':'顺序还需要调整。看看信息是怎样一步步发生或相互作用的。';}const feedback=document.querySelector('#rebuildModule .rebuild-table-feedback');if(feedback){const correct=document.querySelectorAll('#rebuildModule .rebuild-table-value.drop.correct').length;const total=document.querySelectorAll('#rebuildModule .rebuild-table-value.drop').length;feedback.textContent=correct===total?'全部对应正确，你已经抓住了文章结构。':`已完成 ${correct} / ${total} 组正确配对；红色位置需要更换。`;}renderNav();const box=document.querySelector('[data-module-complete="rebuild"]');if(box)box.outerHTML=moduleCompleteBox('rebuild');bindNext();saveProgress();}
    function updateTableCellDom(slotId,pairs,tableState){const cell=document.querySelector(`[data-rebuild-table-slot="${slotId}"]`);if(!cell)return;const optionId=tableState.cells[slotId]||'',value=optionId?rebuildTableOptionText(optionId,pairs):'拖入备选内容';const correct=state.rebuildChecked&&optionId===slotId;const wrong=state.rebuildChecked&&Boolean(optionId)&&optionId!==slotId;cell.classList.toggle('filled',Boolean(optionId));cell.classList.toggle('correct',correct);cell.classList.toggle('wrong',wrong);cell.classList.toggle('selected',tableState.selected===slotId);cell.classList.remove('correct-pop','wrong-pop');if(state.rebuildChecked&&(correct||wrong)){void cell.offsetWidth;cell.classList.add(correct?'correct-pop':'wrong-pop');}cell.textContent=value;const [row,side]=slotId.split('-');cell.setAttribute('aria-label',`第 ${Number(row)+1} 行 ${side==='left'?'左':'右'}，${optionId?value:'空白'}`);cell.toggleAttribute('aria-invalid',state.rebuildChecked&&wrong);}
    function syncTableOptions(pairs,tableState){$$('[data-rebuild-table-option]').forEach(button=>{const optionId=button.dataset.rebuildTableOption;const used=Object.values(tableState.cells).includes(optionId);button.classList.toggle('used',used);const small=button.querySelector('small');if(small)small.textContent=used?'已放入':'拖入';});}
    function renderRebuildTable(kind){const pairs=rebuildPairs(kind);if(!pairs.length){$('#rebuildModule').innerHTML='<div class="panel practice-shell"><div class="state-box"><strong>暂无表格答案</strong>这张卡片需要在 rebuild.pairs 中配置左右两列内容。</div></div>';return}const tableState=rebuildTableState(kind,pairs);const [leftLabel,rightLabel]=rebuildPairLabels(kind);const correct=()=>pairs.filter((_,row)=>{const hidden=tableState.reveals[row]==='left'?'right':'left',slotId=`${row}-${hidden}`;return tableState.cells[slotId]===slotId;}).length;const choices=tableState.optionOrder.map(optionId=>{const used=Object.values(tableState.cells).includes(optionId),selected=tableState.selected===optionId;return `<button type="button" class="rebuild-table-option ${used?'used':''} ${selected?'selected':''}" draggable="true" data-rebuild-table-option="${optionId}" aria-pressed="${selected}"><span>${escapeHtml(rebuildTableOptionText(optionId,pairs))}</span><small>${used?'已放入':'拖入'}</small></button>`;}).join('');const rows=pairs.map((pair,row)=>{const revealed=tableState.reveals[row];const left=revealed==='left'?`<div class="rebuild-table-value given">${escapeHtml(pair[0])}</div>`:rebuildTableDropHtml(row,'left',leftLabel,pairs,tableState);const right=revealed==='right'?`<div class="rebuild-table-value given">${escapeHtml(pair[1])}</div>`:rebuildTableDropHtml(row,'right',rightLabel,pairs,tableState);return `<tr><td>${left}</td><td class="connector" aria-hidden="true">→</td><td>${right}</td></tr>`;}).join('');const currentCorrect=correct();$('#rebuildModule').innerHTML=`<div class="panel practice-shell"><div class="practice-intro"><div><h2 class="section-title task-title"><span class="task-tag">Task 5</span><span class="task-divider" aria-hidden="true"></span><span class="task-name">Rebuild</span></h2><p class="muted">将备选内容填入对应位置，完成结构匹配。</p></div><div class="intro-actions"><span class="badge ${isDone('rebuild')?'success':''}">${isDone('rebuild')?'已提交':'等待检查'}</span><button class="link-btn" id="retryRebuild" type="button">再试一次</button></div></div><section class="rebuild-choice-bank ${rebuildResultClass()}" aria-labelledby="rebuildChoiceTitle"><h3 class="rebuild-choice-bank-title" id="rebuildChoiceTitle">备选内容</h3><div class="rebuild-choice-list">${choices}</div></section><div class="rebuild-table-wrap ${rebuildResultClass()}"><table class="rebuild-table"><thead><tr><th scope="col">${leftLabel}</th><th class="connector" aria-label="对应关系"></th><th scope="col">${rightLabel}</th></tr></thead><tbody>${rows}</tbody></table></div>${state.rebuildChecked?`<p class="rebuild-table-feedback" aria-live="polite">${currentCorrect===pairs.length?'全部对应正确，你已经抓住了文章结构。':`已完成 ${currentCorrect} / ${pairs.length} 组正确配对；红色位置需要更换。`}</p>`:''}</div>${moduleCompleteBox('rebuild')}`;$$('[data-rebuild-table-option]').forEach(button=>{button.onclick=()=>{tableState.selected=tableState.selected===button.dataset.rebuildTableOption?null:button.dataset.rebuildTableOption;$$('[data-rebuild-table-option]').forEach(item=>item.classList.toggle('selected',tableState.selected===item.dataset.rebuildTableOption));};button.addEventListener('dragstart',event=>event.dataTransfer?.setData('text/plain',button.dataset.rebuildTableOption));});$$('[data-rebuild-table-slot]').forEach(slot=>{const place=()=>{if(tableState.selected)placeRebuildTableOption(tableState.selected,slot.dataset.rebuildTableSlot,kind,pairs);};slot.onclick=place;slot.onkeydown=event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();place();}};slot.addEventListener('dragover',event=>{event.preventDefault();slot.classList.add('drag-over');});slot.addEventListener('dragleave',()=>slot.classList.remove('drag-over'));slot.addEventListener('drop',event=>{event.preventDefault();slot.classList.remove('drag-over');const optionId=event.dataTransfer?.getData('text/plain');if(optionId)placeRebuildTableOption(optionId,slot.dataset.rebuildTableSlot,kind,pairs);});});const retryBtn=$('#retryRebuild');if(retryBtn)retryBtn.onclick=resetRebuild;bindNext();}
    function renderRebuild(){const steps=rebuildSteps();const kind=rebuildKind();if(['feature-function','fact-explanation','cause-effect','compare-contrast'].includes(kind)){renderRebuildTable(kind);return}if(!steps.length){$('#rebuildModule').innerHTML='<div class="panel practice-shell"><div class="state-box"><strong>暂无结构步骤</strong>这张卡片还没有配置重建题目。</div></div>';return}const order=rebuildOrderFromState(steps);state.rebuild=order;const label=kind==='cycle'?'循环结构':'流程结构';$('#rebuildModule').innerHTML=`<div class="panel practice-shell"><div class="practice-intro"><div><h2 class="section-title task-title"><span class="task-tag">Task 5</span><span class="task-divider" aria-hidden="true"></span><span class="task-name">Rebuild</span></h2><p class="muted">按文章顺序排列备选句，重建文章结构。</p></div><div class="intro-actions"><span class="badge ${isDone('rebuild')?'success':''}">${isDone('rebuild')?'已提交':'等待检查'}</span><button class="link-btn" id="retryRebuild" type="button">再试一次</button></div></div><div class="rebuild-workspace"><section class="rebuild-canvas ${rebuildResultClass()}" aria-labelledby="rebuildCanvasTitle"><h3 class="rebuild-panel-title" id="rebuildCanvasTitle">${kind==='cycle'?'循环图':'顺序图'}</h3>${rebuildDiagramHtml(steps,order,kind)}<p class="rebuild-drop-hint">可拖放、点选，或用每个方块上的上下箭头调整顺序。</p></section><aside class="rebuild-bank ${rebuildResultClass()}" aria-labelledby="rebuildBankTitle"><h3 class="rebuild-panel-title" id="rebuildBankTitle">备选句</h3><div class="rebuild-bank-list">${steps.map((text,index)=>`<button type="button" class="rebuild-option ${state.rebuildSelected===index?'selected':''}" draggable="true" data-rebuild-option="${index}" aria-pressed="${state.rebuildSelected===index}"><span aria-hidden="true">⋮⋮</span><span>${escapeHtml(text)}</span><small>${order.includes(index)?'已放入':'点选或拖入'}</small></button>`).join('')}</div></aside></div>${state.rebuildChecked?`<div class="alert ${scoreOf('rebuild')===100?'success':'error'}">${scoreOf('rebuild')===100?'结构正确！你已经抓住了文章关系。':'顺序还需要调整。看看信息是怎样一步步发生或相互作用的。'}</div>`:''}</div>${moduleCompleteBox('rebuild')}`;bindRebuildDrag();$$('[data-rebuild-option]').forEach(button=>button.onclick=()=>{state.rebuildSelected=state.rebuildSelected===Number(button.dataset.rebuildOption)?null:Number(button.dataset.rebuildOption);$$('[data-rebuild-option]').forEach(option=>option.classList.toggle('selected',state.rebuildSelected===Number(option.dataset.rebuildOption)));});$$('[data-rebuild-slot]').forEach(slot=>{const place=()=>{if(state.rebuildSelected===null)return;placeRebuildOption(state.rebuildSelected,Number(slot.dataset.position));};slot.addEventListener('click',event=>{if(!event.target.closest('button'))place();});slot.addEventListener('keydown',event=>{if((event.key==='Enter'||event.key===' ')&&!event.target.closest('button')){event.preventDefault();place();}});});$$('[data-move]').forEach(button=>button.onclick=()=>moveRebuildStep(Number(button.dataset.move),Number(button.dataset.move)+Number(button.dataset.dir)));const retryBtn=$('#retryRebuild');if(retryBtn)retryBtn.onclick=resetRebuild;bindNext();}
    function placeRebuildOption(source,target){const steps=rebuildSteps();const wasChecked=state.rebuildChecked;const sourcePosition=state.rebuild.indexOf(source);if(sourcePosition>=0&&sourcePosition!==target)[state.rebuild[sourcePosition],state.rebuild[target]]=[state.rebuild[target],state.rebuild[sourcePosition]];else if(sourcePosition<0)state.rebuild[target]=source;state.rebuildSelected=null;if(wasChecked){state.rebuildChecked=true;$$('[data-rebuild-option]').forEach(option=>option.classList.remove('selected'));if(sourcePosition>=0&&sourcePosition!==target){updateProcessSlotDom(sourcePosition,steps);updateProcessSlotDom(target,steps);}else{updateProcessSlotDom(target,steps);}syncRebuildBank();finalizeRebuildScore(processScore(steps));}else{state.rebuildChecked=false;renderRebuild();saveProgress();scheduleRebuildCheck();}}
    function processScore(steps){const correct=state.rebuild.filter((value,i)=>value===i).length;return Math.round(correct/steps.length*100);}
    function updateProcessSlotDom(pos,steps){const slot=document.querySelector(`[data-rebuild-slot="${pos}"]`);if(!slot)return;const stepIndex=state.rebuild[pos];const correct=state.rebuildChecked&&stepIndex===pos;const wrong=state.rebuildChecked&&stepIndex!==null&&stepIndex!==pos;slot.classList.toggle('empty',stepIndex===null);slot.classList.toggle('correct',correct);slot.classList.toggle('wrong',wrong);slot.classList.remove('correct-pop','wrong-pop');if(state.rebuildChecked&&(correct||wrong)){void slot.offsetWidth;slot.classList.add(correct?'correct-pop':'wrong-pop');}const text=slot.querySelector('strong');if(text)text.textContent=stepIndex===null?'选择备选句后点这里':steps[stepIndex];slot.setAttribute('draggable',String(stepIndex!==null));slot.setAttribute('aria-label',`第 ${pos+1} 个位置，${stepIndex===null?'空白':steps[stepIndex]}`);}
    function moveRebuildStep(from,to){const steps=rebuildSteps();if(to<0||to>=state.rebuild.length)return;const wasChecked=state.rebuildChecked;[state.rebuild[from],state.rebuild[to]]=[state.rebuild[to],state.rebuild[from]];if(wasChecked){state.rebuildChecked=true;updateProcessSlotDom(from,steps);updateProcessSlotDom(to,steps);finalizeRebuildScore(processScore(steps));}else{state.rebuildChecked=false;renderRebuild();saveProgress();scheduleRebuildCheck();}}
    function swapRebuildSteps(a,b){const steps=rebuildSteps();if(a===b)return;const wasChecked=state.rebuildChecked;[state.rebuild[a],state.rebuild[b]]=[state.rebuild[b],state.rebuild[a]];if(wasChecked){state.rebuildChecked=true;updateProcessSlotDom(a,steps);updateProcessSlotDom(b,steps);finalizeRebuildScore(processScore(steps));}else{state.rebuildChecked=false;renderRebuild();saveProgress();scheduleRebuildCheck();}}
    function scheduleRebuildCheck(){clearTimeout(state.rebuildCheckTimer);state.rebuildCheckTimer=setTimeout(checkRebuildAuto,400);}
    function checkRebuildAuto(){if(state.rebuildChecked)return;const kind=rebuildKind();if(['feature-function','fact-explanation','cause-effect','compare-contrast'].includes(kind))checkRebuildTable(kind);else checkRebuildSteps();}
    function checkRebuildSteps(){const steps=rebuildSteps();if(!steps.length||state.rebuild.includes(null))return;const expected=[...steps.keys()];const correct=state.rebuild.filter((value,i)=>value===expected[i]).length;state.rebuildChecked=true;state.rebuildFeedbackAnim=true;complete('rebuild',Math.round(correct/steps.length*100),correct===steps.length?'结构重建正确':'已保存本次结构答案');renderRebuild();state.rebuildFeedbackAnim=false;}
    function checkRebuildTable(kind){const pairs=rebuildPairs(kind);const tableState=rebuildTableState(kind,pairs);const slots=pairs.map((_,row)=>`${row}-${tableState.reveals[row]==='left'?'right':'left'}`);if(slots.some(slotId=>!tableState.cells[slotId]))return;const correct=pairs.filter((_,row)=>{const hidden=tableState.reveals[row]==='left'?'right':'left',slotId=`${row}-${hidden}`;return tableState.cells[slotId]===slotId;}).length;const score=Math.round(correct/pairs.length*100);state.rebuildChecked=true;state.rebuildFeedbackAnim=true;complete('rebuild',score,score===100?'结构重建正确':'已保存本次表格答案');renderRebuildTable(kind);state.rebuildFeedbackAnim=false;}
    function resetRebuild(){clearTimeout(state.rebuildCheckTimer);state.rebuildFeedbackAnim=false;const steps=rebuildSteps();state.rebuild=['feature-function','fact-explanation','cause-effect','compare-contrast'].includes(rebuildKind())?null:Array(steps.length).fill(null);state.rebuildSelected=null;state.rebuildChecked=false;state.moduleStatus.rebuild={completed:false,score:0};renderRebuild();renderNav();saveProgress();}
    function rebuildResultClass(){return state.rebuildChecked?(scoreOf('rebuild')===100?'correct':'wrong'):'';}
    function syncRebuildBank(){const bank=$('.rebuild-bank-list');if(!bank)return;const steps=rebuildSteps();const order=Array.isArray(state.rebuild)?state.rebuild:[];ensureRebuildBankOrder(steps);const options=new Map($$('[data-rebuild-option]').map(option=>[Number(option.dataset.rebuildOption),option]));const available=state.rebuildBankOrder.filter(index=>!order.includes(index));bank.innerHTML='';if(!available.length){bank.innerHTML='<p class="rebuild-option-empty" aria-live="polite">所有备选句都已放入图中。</p>';return}available.forEach(index=>{const option=options.get(index);if(option)bank.append(option);});}
    function bindRebuildDrag(){syncRebuildBank();let dragged=null;$$('[data-rebuild-option],[data-rebuild-slot]').forEach(node=>{node.addEventListener('dragstart',event=>{dragged=node;node.classList.add('dragging');event.dataTransfer?.setData('text/plain',node.dataset.rebuildOption??node.dataset.position??'');});node.addEventListener('dragend',()=>{node.classList.remove('dragging');dragged=null;$$('[data-rebuild-slot]').forEach(slot=>slot.classList.remove('drag-over'));});});$$('[data-rebuild-slot]').forEach(slot=>{slot.addEventListener('dragover',event=>{event.preventDefault();slot.classList.add('drag-over');});slot.addEventListener('dragleave',()=>slot.classList.remove('drag-over'));slot.addEventListener('drop',event=>{event.preventDefault();slot.classList.remove('drag-over');const target=Number(slot.dataset.position);const source=Number(event.dataTransfer?.getData('text/plain'));if(!Number.isInteger(source)||!Number.isInteger(target))return;if(dragged?.dataset.rebuildOption!==undefined)placeRebuildOption(source,target);else if(source!==target)swapRebuildSteps(source,target);});});}


    function bindNext(){$$('[data-next]').forEach(button=>button.onclick=()=>openModule(button.dataset.next));$$('[data-prev]').forEach(button=>button.onclick=()=>openModule(button.dataset.prev));$$('[data-next-lesson]').forEach(button=>button.onclick=()=>location.href='/index.html?lesson='+encodeURIComponent(button.dataset.nextLesson));$$('[data-prev-lesson]').forEach(button=>button.onclick=()=>{const value=button.dataset.prevLesson;if(value)location.href='/index.html?lesson='+encodeURIComponent(value);});}
    function moduleCompleteBox(id){const index=modules.findIndex(([moduleId])=>moduleId===id);const[,en,,members=[id]]=modules[index];const done=members.every(isDone);const next=modules[index+1];const previous=modules[index-1];const unit=id==='rebuild'?'课':'关';const title=done?`恭喜你完成本${unit}，让我们进入下一${unit}`:`完成本${unit}后将解锁下一${unit}`;const note=done?`「${en}」已全部完成，继续加油！`:`先完成「${en}」里的全部任务`;const previousLesson=state.previousLesson;const prevButton=previous&&['words','comprehension','rebuild'].includes(id)?`<button type="button" class="module-prev" data-prev="${previous[0]}" aria-label="回到上一关"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>`:(id==='reading'?`<button type="button" class="module-prev" ${previousLesson?'':'disabled'} data-prev-lesson="${previousLesson?escapeHtml(previousLesson.slug||previousLesson.id):''}" aria-label="${previousLesson?'回到上一课':'没有上一课'}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>`:'');const nextLesson=state.nextLesson;const action=id==='rebuild'?(nextLesson?`<div class="module-actions"><button type="button" class="btn primary" data-next-lesson="${escapeHtml(nextLesson.slug||nextLesson.id)}" ${done?'':'disabled'}>${done?'前往下一课':'进入下一课'}</button></div>`:(done?`<a class="btn primary" href="/syllabus.html">返回课程</a>`:`<button type="button" class="btn primary" disabled>暂无下一课</button>`)):`<div class="module-actions"><button type="button" class="btn primary" data-next="${next[0]}" ${done?'':'disabled'}>进入下一关</button></div>`;return `<div class="module-complete ${done?'done':''}" data-module-complete="${id}">${prevButton}<div><strong>${title}</strong><small>${note}</small></div>${action}</div>`;}
function complete(module,score,message){state.moduleStatus[module]={completed:true,score,completedAt:new Date().toISOString()};renderNav();saveProgress();const boxModule=module==='listening'?'reading':module;const box=document.querySelector(`[data-module-complete="${boxModule}"]`);if(box)box.outerHTML=moduleCompleteBox(boxModule);bindNext();}
    async function saveProgress(){if(!state.card)return;const completedPercent=Math.round(completedCount()/modules.length*100);try{await api(`/api/progress/${encodeURIComponent(currentUserId())}`,{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify({cardId:state.card.cardId,lastModule:state.active,wordBankReviewed:state.wordBankReviewed,answers:{context:state.context,comprehension:state.comprehension,contextChecked:state.contextChecked,comprehensionChecked:state.comprehensionChecked},matched:state.matched,wordTileMatched:state.wordTileMatched,rebuild:state.rebuild,rebuildChecked:state.rebuildChecked,submittedPractice:state.submittedPractice,moduleStatus:state.moduleStatus,completedPercent})});}catch(error){showError({title:'进度保存失败',message:'学习进度暂时无法保存，请检查网络后重试。',detail:error?.message||'',source:'进度',retry:()=>saveProgress()});}}
    async function loadProgress(){try{const data=await api(`/api/progress/${encodeURIComponent(currentUserId())}`);const saved=data.cards?.[state.card.cardId];if(!saved)return;state.wordBankReviewed=Boolean(saved.wordBankReviewed);state.context=saved.answers?.context||{};state.contextChecked=Boolean(saved.answers?.contextChecked);contextQuestions().forEach((q,i)=>{const options=normalizeOptions(q);if(options[state.context[i]])state.context[i]=options[state.context[i]];});state.comprehension=saved.answers?.comprehension||saved.answers||{};state.comprehensionChecked=Boolean(saved.answers?.comprehensionChecked);state.matched=saved.matched||[];state.wordTileMatched=(saved.wordTileMatched||[]).map(String);state.wordTileSide=[...state.wordTileMatched];state.rebuild=saved.rebuild||saved.steps||[];state.rebuildChecked=Boolean(saved.rebuildChecked);state.submittedPractice=saved.submittedPractice||[];state.moduleStatus=saved.moduleStatus||{};state.active=modules.some(([id,,,members=[id]])=>id===saved.lastModule||members.includes(saved.lastModule))?saved.lastModule:'reading';}catch(error){showError({title:'学习进度加载失败',message:'已继续加载课程，但上次进度暂时无法恢复。',detail:error?.message||'',source:'进度',retry:()=>loadProgress()});}}
    async function loadLessonNeighbors(){try{const data=await api('/api/cards');const course=state.card.courseId||state.card.seriesId;const cards=(data.cards||[]).filter(card=>card.status==='published'&&(!course||card.courseId===course||card.seriesId===course));const current=state.card.cardId||state.card.slug;const index=cards.findIndex(card=>card.id===current||card.slug===current||card.slug===state.card.slug||card.id===state.card.slug);state.previousLesson=index>0?cards[index-1]:null;state.nextLesson=index>=0&&index<cards.length-1?cards[index+1]:null;}catch(error){state.previousLesson=null;state.nextLesson=null;showError({title:'课程列表加载失败',message:'上一课/下一课暂时不可用，其余功能不受影响。',detail:error?.message||'',source:'课程列表',retry:()=>loadLessonNeighbors()});}}
    function renderAll(){renderReading();renderWords();renderComprehension();renderRebuild();renderNav();}

    async function boot(){try{state.card=await api(`/api/cards/${encodeURIComponent(slug)}`);await loadProgress();await loadLessonNeighbors();await loadAudioManifest();loadRecordingState();document.title=`${state.card.title} · Fluent Science Reading`;$('#meta').innerHTML=`<span class="badge">DAY ${String(state.card.day).padStart(3,'0')}</span><span class="badge">${escapeHtml(state.card.level||'L1')}</span><span class="badge">${escapeHtml(state.card.theme||'')}</span><span class="badge warning">${escapeHtml(state.card.articleStructure||state.card.structure||'Science Reading')}</span>`;$('#title').textContent=state.card.title;$('#bigQuestionLabel').textContent=state.card.bigQuestion||'';$('#loading').classList.add('hidden');$('#app').classList.remove('hidden');renderAll();openModule(state.active,false);}catch(error){$('#loading').classList.add('hidden');showError({title:'课程加载失败',message:error?.message||'这张学习卡片暂时打不开，请稍后再试。',detail:`页面地址：${location.href}`,source:'课程',retry:()=>location.reload()});}}
    boot();
  </script>
