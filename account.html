<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="登录并查看 Fluent Science Reading 学习进度。"><meta property="og:title" content="Fluent Science Reading · My Learning"><meta property="og:description" content="保存并继续你的英语科普阅读进度。"><meta property="og:image" content="/og.png"><meta name="twitter:card" content="summary_large_image">
  <title>我的学习 · Fluent Science Reading</title><link rel="stylesheet" href="/styles.css">
  <style>
    .account-layout{display:grid;grid-template-columns:.85fr 1.15fr;gap:18px}.intro{padding:30px;background:linear-gradient(145deg,var(--ink),#2e6097);color:#fff}.intro .eyebrow{color:#ffd6c9}.intro p{color:#d9e6f3}.feature-list{display:grid;gap:12px;margin-top:28px}.feature{padding:13px;border:1px solid rgba(255,255,255,.2);border-radius:13px;background:rgba(255,255,255,.06)}.auth{padding:26px}.auth-tabs{display:flex;gap:7px;margin-bottom:18px}.auth-tab{flex:1;border:1px solid var(--line);border-radius:12px;padding:10px;background:#fff;font-weight:850;cursor:pointer}.auth-tab.active{border-color:var(--blue);background:var(--blue-soft);color:var(--blue)}.dashboard{display:grid;gap:16px}.profile-head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{padding:16px;border:1px solid var(--line);border-radius:14px;background:#fff}.stat strong{display:block;font-size:28px}.recent{display:grid;gap:8px}.recent-row{display:flex;justify-content:space-between;gap:12px;padding:12px;border:1px solid var(--line);border-radius:12px}.recent-row strong,.recent-row small{display:block}.recent-row small{color:var(--muted)}@media(max-width:760px){.account-layout{grid-template-columns:1fr}.intro{padding:22px}.auth{padding:19px}}@media(max-width:480px){.stats{grid-template-columns:1fr}.profile-head{display:block}.profile-head .btn{margin-top:12px;width:100%}}
  </style>
</head>
<body><div class="shell"><div id="nav"></div><div class="account-layout"><section class="panel intro"><p class="eyebrow">Your learning space</p><h1 class="page-title">每次学习，都从上次停下的地方继续</h1><p>登录后，课程目录、练习答案、模块得分和录音记录会归入同一个学习账号。</p><div class="feature-list"><div class="feature"><strong>自动保存进度</strong><br><small>刷新页面也能继续完成六个模块。</small></div><div class="feature"><strong>看懂学习结果</strong><br><small>完成度和练习得分分开记录。</small></div><div class="feature"><strong>保护个人记录</strong><br><small>登录用户只能访问自己的学习数据。</small></div></div></section><main class="panel auth"><div id="authView"><div class="auth-tabs"><button class="auth-tab active" data-mode="login" type="button">登录</button><button class="auth-tab" data-mode="register" type="button">注册</button></div><div><p class="eyebrow" id="formEyebrow">Welcome back</p><h2 class="section-title" id="formTitle">继续你的科学阅读</h2><p class="muted" id="formHint">还没有账号？切换到注册即可创建。</p></div><form id="authForm" class="form-grid" style="margin-top:20px"><div class="field"><label for="email">邮箱</label><input id="email" name="email" type="email" autocomplete="email" required placeholder="student@example.com"></div><div class="field"><label for="password">密码</label><input id="password" name="password" type="password" minlength="6" autocomplete="current-password" required placeholder="至少 6 位"></div><div id="formMessage" class="alert hidden" role="alert"></div><button id="submit" class="btn primary" type="submit">登录</button></form></div><div id="dashboard" class="dashboard hidden"></div></main></div></div>
<script type="module">
import{$,$$,api,escapeHtml,nav,getSession,setSession,formatDate,toast}from'/shared.js';$('#nav').innerHTML=nav('account');let mode='login';
function setMode(next){mode=next;$$('[data-mode]').forEach(button=>button.classList.toggle('active',button.dataset.mode===mode));$('#formEyebrow').textContent=mode==='login'?'Welcome back':'Create an account';$('#formTitle').textContent=mode==='login'?'继续你的科学阅读':'建立你的学习档案';$('#formHint').textContent=mode==='login'?'还没有账号？切换到注册即可创建。':'使用邮箱和至少 6 位密码创建账号。';$('#submit').textContent=mode==='login'?'登录':'注册并登录';$('#password').autocomplete=mode==='login'?'current-password':'new-password';$('#formMessage').classList.add('hidden');}
$$('[data-mode]').forEach(button=>button.onclick=()=>setMode(button.dataset.mode));
$('#authForm').onsubmit=async event=>{event.preventDefault();const submit=$('#submit');submit.disabled=true;$('#formMessage').classList.add('hidden');try{const data=await api(`/api/auth/${mode}`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email:$('#email').value,password:$('#password').value})});setSession(data);await showDashboard();toast(mode==='login'?'登录成功':'账号创建成功');}catch(error){const box=$('#formMessage');box.textContent=error.message;box.className='alert error';}finally{submit.disabled=false;}};
async function showDashboard(){const session=getSession();try{const data=await api('/api/auth/me');$('#authView').classList.add('hidden');const dashboard=$('#dashboard');dashboard.classList.remove('hidden');dashboard.innerHTML=`<div class="profile-head"><div><p class="eyebrow">Student profile</p><h2 class="section-title">${escapeHtml(data.user.email)}</h2><p class="muted">学习账号 · 创建于 ${new Date(data.user.createdAt).toLocaleDateString('zh-CN')}</p></div><button class="btn danger" id="logout" type="button">退出登录</button></div><div class="stats"><div class="stat"><span class="muted">已开始</span><strong>${data.summary.started}</strong><small>张卡片</small></div><div class="stat"><span class="muted">已完成</span><strong>${data.summary.completed}</strong><small>张卡片</small></div><div class="stat"><span class="muted">平均完成度</span><strong>${data.summary.average}%</strong><small>全部记录</small></div></div><div><p class="eyebrow">Recent learning</p><h3>最近学习</h3><div class="recent">${data.summary.recent.length?data.summary.recent.map(item=>`<a class="recent-row" href="/lesson/${encodeURIComponent(item.cardId)}"><span><strong>${escapeHtml(item.cardId)}</strong><small>${formatDate(item.updatedAt)}</small></span><span class="badge">${Number(item.completedPercent||0)}%</span></a>`).join(''):'<div class="state-box"><strong>还没有学习记录</strong><a class="btn primary" href="/syllabus.html">选择第一课</a></div>'}</div></div>`;$('#logout').onclick=async()=>{if(session){await api('/api/auth/logout',{method:'POST'}).catch(()=>{});setSession(null);location.reload();}else{location.href='/signout-with-chatgpt?return_to=/account.html';}};}catch{if(session)setSession(null);$('#authView').classList.remove('hidden');$('#dashboard').classList.add('hidden');}}
showDashboard();
</script></body></html>
