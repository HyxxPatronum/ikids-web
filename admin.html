<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Fluent Science Reading 内容校验、发布与数据概览。">
  <meta property="og:title" content="Fluent Science Reading · 内容工作台">
  <meta property="og:description" content="校验、预览和管理英语科普阅读内容。">
  <meta property="og:image" content="/og.png">
  <meta name="twitter:card" content="summary_large_image">
  <title>内容工作台 · Fluent Science Reading</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    .admin-head{display:flex;justify-content:space-between;gap:32px;align-items:center;padding:32px;margin-bottom:18px;background:var(--surface)}
    .admin-intro{max-width:680px}.admin-intro .muted{max-width:62ch;margin:10px 0 0}.admin-head .btn{flex:0 0 auto}
    .metrics{display:grid;grid-template-columns:repeat(6,1fr);margin-bottom:18px;overflow:hidden}.metric{min-width:0;padding:17px 20px}.metric+.metric{border-left:1px solid var(--line)}.metric span{display:block;color:var(--muted);font-size:12px;font-weight:700}.metric strong{display:block;margin-top:3px;font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
    .admin-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(320px,.75fr);gap:18px;align-items:start}.stack{display:grid;gap:18px;min-width:0}.section{padding:24px;min-width:0}.section-head{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:18px}.section-heading{display:grid;gap:4px}.section-kicker{margin:0;color:var(--muted);font-size:12px;font-weight:700}.validator{position:sticky;top:18px}
    .table-wrap{overflow:auto;border:1px solid var(--line);border-radius:14px}.content-table{width:100%;border-collapse:collapse;font-size:13px}.content-table th,.content-table td{padding:12px 13px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle;white-space:nowrap}.content-table tbody tr:last-child td{border-bottom:0}.content-table th{background:var(--surface-subtle);color:var(--muted);font-size:11px;font-weight:850;letter-spacing:.04em}.content-table tbody tr{transition:background-color .16s ease}.content-table tbody tr:hover{background:color-mix(in srgb,var(--blue-soft) 55%,white)}.content-table .title-cell{min-width:190px;white-space:normal}.content-table small{display:block;margin-top:2px;font-variant-numeric:tabular-nums}.row-actions{display:flex;gap:6px;justify-content:flex-end}.row-actions .btn{min-height:34px;padding:6px 10px;font-size:12px}
    .validation-list{margin:10px 0 0;padding-left:20px}.series-form{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}.series-form .wide{grid-column:1/-1}.form-actions{display:flex;justify-content:flex-end}.json-help{margin:0 0 12px;color:var(--muted);font-size:13px}.loading-copy{color:var(--muted);font-size:13px}
    @media(max-width:1040px){.metrics{grid-template-columns:repeat(3,1fr)}.metric:nth-child(4){border-left:0}.metric:nth-child(n+4){border-top:1px solid var(--line)}.admin-grid{grid-template-columns:1fr}.validator{position:static}}
    @media(max-width:680px){.admin-head{align-items:flex-start;padding:24px 20px}.metrics{grid-template-columns:repeat(2,1fr)}.metric:nth-child(3),.metric:nth-child(5){border-left:0}.metric:nth-child(3){border-top:1px solid var(--line)}.metric:nth-child(4){border-left:1px solid var(--line)}.section{padding:20px}.series-form{grid-template-columns:1fr}.series-form .wide{grid-column:auto}.table-wrap{overflow:visible;border:0;border-radius:0}.content-table,.content-table tbody{display:grid;gap:10px}.content-table thead{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}.content-table tr{display:grid;grid-template-columns:1fr auto;gap:8px 14px;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}.content-table td{display:grid;grid-template-columns:70px minmax(0,1fr);gap:8px;padding:0;border:0;white-space:normal}.content-table td::before{content:attr(data-label);color:var(--muted);font-size:11px;font-weight:800}.content-table .title-cell,.content-table .action-cell{grid-column:1/-1;min-width:0}.content-table .title-cell{display:block;padding-bottom:8px;border-bottom:1px solid var(--line)}.content-table .title-cell::before,.content-table .action-cell::before{display:none}.content-table .action-cell{padding-top:4px}.row-actions{justify-content:stretch}.row-actions .btn{flex:1;min-height:40px}}
  </style>
</head>
<body>
  <div class="shell">
    <div id="nav"></div>
    <main>
      <section class="panel admin-head" aria-labelledby="pageTitle">
        <div class="admin-intro"><h1 class="page-title" id="pageTitle">内容工作台</h1><p class="muted">校验课程内容、管理发布状态，并快速掌握全站内容与学习数据。</p></div>
        <button class="btn" id="refresh" type="button">刷新数据</button>
      </section>
      <section class="panel metrics" id="stats" aria-label="内容数据概览" aria-live="polite"><div class="metric"><span class="loading-copy">正在载入数据…</span></div></section>
      <div class="admin-grid">
        <div class="stack">
          <section class="panel section" aria-labelledby="cardsTitle">
            <div class="section-head"><div class="section-heading"><h2 class="section-title" id="cardsTitle">卡片管理</h2><p class="section-kicker">预览、发布或下架阅读卡片</p></div><span class="badge" id="cardCount">—</span></div>
            <div id="cards" class="table-wrap" aria-live="polite"><div class="skeleton"></div></div>
          </section>
          <section class="panel section" aria-labelledby="seriesTitle">
            <div class="section-head"><div class="section-heading"><h2 class="section-title" id="seriesTitle">系列管理</h2><p class="section-kicker">维护课程系列与学习路径</p></div></div>
            <div id="series" class="table-wrap" aria-live="polite"><div class="skeleton"></div></div>
            <form id="seriesForm" class="series-form">
              <div class="field"><label for="seriesId">系列 ID</label><input id="seriesId" required pattern="[a-z0-9-]+" placeholder="earth-and-space" autocomplete="off" aria-describedby="seriesIdHelp"><small class="muted" id="seriesIdHelp">仅限小写字母、数字和连字符</small></div>
              <div class="field"><label for="seriesName">系列名称</label><input id="seriesName" required placeholder="Earth and Space" autocomplete="off"></div>
              <div class="field wide"><label for="seriesSubtitle">系列简介</label><input id="seriesSubtitle" placeholder="用一句话说明这条学习路径" autocomplete="off"></div>
              <div class="form-actions wide"><button class="btn primary" type="submit">创建草稿系列</button></div>
            </form>
          </section>
        </div>
        <aside class="panel section validator" aria-labelledby="validatorTitle">
          <div class="section-head"><div class="section-heading"><h2 class="section-title" id="validatorTitle">校验与导入</h2><p class="section-kicker">JSON validator</p></div><button class="btn" id="loadSample" type="button">载入示例</button></div>
          <p class="json-help">粘贴完整的卡片 JSON。校验通过后才能保存为草稿。</p>
          <div class="field"><label for="cardJson">卡片 JSON</label><textarea id="cardJson" spellcheck="false" placeholder="在这里粘贴完整的卡片 JSON…"></textarea></div>
          <div class="btn-row" style="margin-top:12px"><button class="btn blue" id="validate" type="button">校验内容</button><button class="btn primary" id="saveDraft" type="button" disabled>保存为草稿</button></div>
          <div id="validation" class="alert hidden" style="margin-top:13px" role="status" aria-live="polite"></div>
        </aside>
      </div>
    </main>
  </div>
  <script type="module">
    import{$,$$,api,escapeHtml,nav,toast}from'/shared.js';
    $('#nav').innerHTML=nav('admin');let parsed=null;
    const statusLabels={draft:'草稿',published:'已发布',archived:'已归档'};
    function statusBadge(status){const tone=status==='published'?'success':status==='archived'?'':'warning';return`<span class="badge ${tone}"><span class="status-dot" aria-hidden="true"></span>${escapeHtml(statusLabels[status]||status)}</span>`}
    function setRefreshState(loading){const button=$('#refresh');button.disabled=loading;button.setAttribute('aria-busy',String(loading));button.textContent=loading?'刷新中…':'刷新数据'}
    async function load(){setRefreshState(true);try{const data=await api('/api/dashboard');const labels=[['系列',data.counts.series],['卡片',data.counts.cards],['已发布',data.counts.published],['用户',data.counts.users],['学习记录',data.counts.progress],['录音',data.counts.recordings]];$('#stats').innerHTML=labels.map(([label,value])=>`<div class="metric"><span>${label}</span><strong>${value}</strong></div>`).join('');$('#cardCount').textContent=`${data.cards.length} 张`;
      $('#cards').innerHTML=data.cards.length?`<table class="content-table"><thead><tr><th>卡片</th><th>系列</th><th>天数</th><th>文章结构</th><th>状态</th><th style="text-align:right">操作</th></tr></thead><tbody>${data.cards.map(card=>`<tr><td class="title-cell"><strong>${escapeHtml(card.title)}</strong><small class="muted">${escapeHtml(card.id)}</small></td><td data-label="系列">${escapeHtml(card.seriesId||card.courseId)}</td><td data-label="天数">Day ${card.day}</td><td data-label="结构">${escapeHtml(card.articleStructure||'—')}</td><td data-label="状态">${statusBadge(card.status)}</td><td class="action-cell"><div class="row-actions"><a class="btn" href="/lesson/${encodeURIComponent(card.slug||card.id)}" target="_blank" rel="noopener">预览</a>${card.status!=='published'?`<button class="btn primary" type="button" data-card-action="publish" data-card="${escapeHtml(card.id)}">发布</button>`:''}${card.status!=='archived'?`<button class="btn danger" type="button" data-card-action="archive" data-card="${escapeHtml(card.id)}">下架</button>`:''}</div></td></tr>`).join('')}</tbody></table>`:'<div class="state-box"><strong>暂无卡片</strong>导入或创建一张阅读卡片后，它会显示在这里。</div>';
      $('#series').innerHTML=data.series.length?`<table class="content-table"><thead><tr><th>ID</th><th>名称</th><th>状态</th><th style="text-align:right">操作</th></tr></thead><tbody>${data.series.map(series=>`<tr><td class="title-cell"><strong>${escapeHtml(series.id)}</strong></td><td data-label="名称">${escapeHtml(series.name)}</td><td data-label="状态">${statusBadge(series.status)}</td><td class="action-cell"><div class="row-actions">${series.status!=='archived'?`<button class="btn danger" type="button" data-series-archive="${escapeHtml(series.id)}">归档</button>`:'<span class="muted">无需操作</span>'}</div></td></tr>`).join('')}</tbody></table>`:'<div class="state-box"><strong>暂无系列</strong>使用下方表单创建第一条学习路径。</div>';bindRows()}catch(error){const message=`<div class="state-box"><strong>管理数据加载失败</strong>${escapeHtml(error.message)}。请稍后刷新重试。</div>`;$('#cards').innerHTML=message;$('#series').innerHTML=message;toast('数据加载失败，请重试')}finally{setRefreshState(false)}}
    function bindRows(){$$('[data-card-action]').forEach(button=>{button.onclick=async()=>{const action=button.dataset.cardAction;if(action==='archive'&&!confirm('下架后，学生目录将不再显示这张卡片。确定继续吗？'))return;button.disabled=true;try{await api(`/api/cards/${encodeURIComponent(button.dataset.card)}/${action}`,{method:'POST'});toast(action==='publish'?'卡片已发布':'卡片已下架');await load()}catch(error){toast(error.message);button.disabled=false}}});$$('[data-series-archive]').forEach(button=>{button.onclick=async()=>{if(!confirm('归档后，该系列将不再用于新内容。确定继续吗？'))return;button.disabled=true;try{await api(`/api/series/${encodeURIComponent(button.dataset.seriesArchive)}`,{method:'DELETE'});toast('系列已归档');await load()}catch(error){toast(error.message);button.disabled=false}}})}
    $('#refresh').onclick=load;
    $('#seriesForm').onsubmit=async event=>{event.preventDefault();const submit=event.submitter;submit.disabled=true;try{await api('/api/series',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({id:$('#seriesId').value,name:$('#seriesName').value,subtitle:$('#seriesSubtitle').value,status:'draft'})});event.target.reset();toast('草稿系列已创建');await load()}catch(error){toast(error.message)}finally{submit.disabled=false}};
    $('#loadSample').onclick=async()=>{const button=$('#loadSample');button.disabled=true;try{const card=await api('/api/cards/day001-flower');card.cardId=`draft-${Date.now()}`;card.status='draft';delete card.slug;$('#cardJson').value=JSON.stringify(card,null,2);parsed=null;$('#saveDraft').disabled=true;$('#validation').className='alert hidden';$('#cardJson').focus()}catch(error){toast(error.message)}finally{button.disabled=false}};
    $('#validate').onclick=async()=>{const box=$('#validation');try{parsed=JSON.parse($('#cardJson').value);const result=await api('/api/cards/validate',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(parsed)});box.className=`alert ${result.valid?'success':'error'}`;box.innerHTML=result.valid?'<strong>校验通过</strong><br>内容结构完整，可以保存为草稿。':`<strong>发现 ${result.errors.length} 个问题</strong><ul class="validation-list">${result.errors.map(error=>`<li>${escapeHtml(error)}</li>`).join('')}</ul>`;$('#saveDraft').disabled=!result.valid}catch(error){parsed=null;$('#saveDraft').disabled=true;box.className='alert error';box.textContent=error instanceof SyntaxError?'JSON 格式不正确，请检查逗号、引号和括号。':`${error.message} 请修正后重试。`}};
    $('#cardJson').addEventListener('input',()=>{parsed=null;$('#saveDraft').disabled=true;$('#validation').className='alert hidden'});
    $('#saveDraft').onclick=async()=>{if(!parsed)return;const button=$('#saveDraft');button.disabled=true;try{await api('/api/cards',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(parsed)});toast('卡片草稿已保存');parsed=null;await load()}catch(error){toast(error.message);button.disabled=false}};load();
  </script>
</body>
</html>
