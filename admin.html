<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Fluent Science Reading 内容校验、发布和数据概览。"><meta property="og:title" content="Fluent Science Reading · Content Workspace"><meta property="og:description" content="校验、预览和管理英语科普阅读内容。"><meta property="og:image" content="/og.png"><meta name="twitter:card" content="summary_large_image">
  <title>内容工作台 · Fluent Science Reading</title><link rel="stylesheet" href="/styles.css">
  <style>
    .admin-head{display:flex;justify-content:space-between;gap:20px;align-items:flex-end;padding:26px;margin-bottom:16px;background:linear-gradient(135deg,#fff,#fff7ef)}.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:9px;margin-bottom:16px}.stat{padding:15px}.stat span{display:block;color:var(--muted);font-size:12px}.stat strong{font-size:26px}.admin-grid{display:grid;grid-template-columns:1.08fr .92fr;gap:16px;align-items:start}.section{padding:21px}.section-head{display:flex;justify-content:space-between;gap:15px;align-items:flex-start;margin-bottom:16px}.table-wrap{overflow:auto}.content-table{width:100%;border-collapse:collapse;font-size:13px}.content-table th,.content-table td{padding:11px 9px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}.content-table th{color:var(--muted);font-size:11px;text-transform:uppercase}.row-actions{display:flex;gap:6px}.row-actions .btn{min-height:34px;padding:6px 9px;font-size:12px}.validation-list{margin:10px 0 0;padding-left:20px}.stack{display:grid;gap:16px}.series-form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.series-form .wide{grid-column:1/-1}@media(max-width:980px){.stats{grid-template-columns:repeat(3,1fr)}.admin-grid{grid-template-columns:1fr}}@media(max-width:600px){.admin-head{display:block;padding:20px}.stats{grid-template-columns:repeat(2,1fr)}.section{padding:15px}.series-form{grid-template-columns:1fr}.series-form .wide{grid-column:auto}}
  </style>
</head>
<body><div class="shell"><div id="nav"></div><section class="panel admin-head"><div><p class="eyebrow">Content operations</p><h1 class="page-title">内容工作台</h1><p class="muted">先校验，再保存草稿；发布和下架都保留内容记录。</p></div><button class="btn" id="refresh" type="button">刷新数据</button></section><section class="stats" id="stats"><div class="panel stat skeleton"></div></section><div class="admin-grid"><div class="stack"><section class="panel section"><div class="section-head"><div><p class="eyebrow">Cards</p><h2 class="section-title">卡片管理</h2></div><span class="badge" id="cardCount">—</span></div><div id="cards" class="table-wrap"><div class="skeleton"></div></div></section><section class="panel section"><div class="section-head"><div><p class="eyebrow">Series</p><h2 class="section-title">系列管理</h2></div></div><div id="series" class="table-wrap"></div><form id="seriesForm" class="series-form" style="margin-top:16px"><div class="field"><label for="seriesId">系列 ID</label><input id="seriesId" required pattern="[a-z0-9-]+" placeholder="earth-and-space"></div><div class="field"><label for="seriesName">名称</label><input id="seriesName" required placeholder="Earth and Space"></div><div class="field wide"><label for="seriesSubtitle">简介</label><input id="seriesSubtitle" placeholder="A short learning path description"></div><button class="btn primary wide" type="submit">创建草稿系列</button></form></section></div><aside class="panel section"><div class="section-head"><div><p class="eyebrow">JSON validator</p><h2 class="section-title">卡片校验与导入</h2></div><button class="btn" id="loadSample" type="button">载入示例</button></div><div class="field"><label for="cardJson">卡片 JSON</label><textarea id="cardJson" spellcheck="false" placeholder="在这里粘贴完整卡片 JSON…"></textarea></div><div class="btn-row" style="margin-top:12px"><button class="btn blue" id="validate" type="button">校验内容</button><button class="btn primary" id="saveDraft" type="button" disabled>保存为草稿</button></div><div id="validation" class="alert hidden" style="margin-top:13px" role="status"></div></aside></div></div>
<script type="module">
import{$,$$,api,escapeHtml,nav,toast}from'/shared.js';$('#nav').innerHTML=nav('admin');let parsed=null;
function statusBadge(status){return`<span class="badge ${status==='published'?'success':status==='archived'?'':'warning'}">${escapeHtml(status)}</span>`}
async function load(){try{const data=await api('/api/dashboard');const labels=[['系列',data.counts.series],['卡片',data.counts.cards],['已发布',data.counts.published],['用户',data.counts.users],['学习记录',data.counts.progress],['录音',data.counts.recordings]];$('#stats').innerHTML=labels.map(([label,value])=>`<div class="panel stat"><span>${label}</span><strong>${value}</strong></div>`).join('');$('#cardCount').textContent=`${data.cards.length} cards`;$('#cards').innerHTML=data.cards.length?`<table class="content-table"><thead><tr><th>Card</th><th>系列</th><th>Day</th><th>结构</th><th>状态</th><th>操作</th></tr></thead><tbody>${data.cards.map(card=>`<tr><td><strong>${escapeHtml(card.title)}</strong><br><small class="muted">${escapeHtml(card.id)}</small></td><td>${escapeHtml(card.seriesId||card.courseId)}</td><td>${card.day}</td><td>${escapeHtml(card.articleStructure||'—')}</td><td>${statusBadge(card.status)}</td><td><div class="row-actions"><a class="btn" href="/lesson/${encodeURIComponent(card.slug||card.id)}" target="_blank">预览</a>${card.status!=='published'?`<button class="btn primary" data-card-action="publish" data-card="${escapeHtml(card.id)}">发布</button>`:''}${card.status!=='archived'?`<button class="btn danger" data-card-action="archive" data-card="${escapeHtml(card.id)}">下架</button>`:''}</div></td></tr>`).join('')}</tbody></table>`:'<div class="state-box">暂无卡片</div>';$('#series').innerHTML=data.series.length?`<table class="content-table"><thead><tr><th>ID</th><th>名称</th><th>状态</th><th>操作</th></tr></thead><tbody>${data.series.map(series=>`<tr><td>${escapeHtml(series.id)}</td><td>${escapeHtml(series.name)}</td><td>${statusBadge(series.status)}</td><td>${series.status!=='archived'?`<button class="btn danger" data-series-archive="${escapeHtml(series.id)}">归档</button>`:'—'}</td></tr>`).join('')}</tbody></table>`:'<div class="state-box">暂无系列</div>';bindRows();}catch(error){$('#cards').innerHTML=`<div class="state-box"><strong>管理数据加载失败</strong>${escapeHtml(error.message)}</div>`;}}
function bindRows(){$$('[data-card-action]').forEach(button=>button.onclick=async()=>{const action=button.dataset.cardAction;if(action==='archive'&&!confirm('下架后学生目录将不再显示这张卡片，确定继续吗？'))return;button.disabled=true;try{await api(`/api/cards/${encodeURIComponent(button.dataset.card)}/${action}`,{method:'POST'});toast(action==='publish'?'卡片已发布':'卡片已下架');await load();}catch(error){toast(error.message);}finally{button.disabled=false;}});$$('[data-series-archive]').forEach(button=>button.onclick=async()=>{if(!confirm('确定归档这个课程系列吗？'))return;try{await api(`/api/series/${encodeURIComponent(button.dataset.seriesArchive)}`,{method:'DELETE'});toast('系列已归档');await load();}catch(error){toast(error.message);}});}
$('#refresh').onclick=load;$('#seriesForm').onsubmit=async event=>{event.preventDefault();try{await api('/api/series',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({id:$('#seriesId').value,name:$('#seriesName').value,subtitle:$('#seriesSubtitle').value,status:'draft'})});event.target.reset();toast('草稿系列已创建');await load();}catch(error){toast(error.message);}};
$('#loadSample').onclick=async()=>{try{const card=await api('/api/cards/day001-flower');card.cardId=`draft-${Date.now()}`;card.status='draft';delete card.slug;$('#cardJson').value=JSON.stringify(card,null,2);parsed=null;$('#saveDraft').disabled=true;}catch(error){toast(error.message);}};
$('#validate').onclick=async()=>{const box=$('#validation');try{parsed=JSON.parse($('#cardJson').value);const result=await api('/api/cards/validate',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(parsed)});box.classList.remove('hidden');box.className=`alert ${result.valid?'success':'error'}`;box.innerHTML=result.valid?'<strong>校验通过</strong><br>内容可以保存为草稿。':`<strong>发现 ${result.errors.length} 个问题</strong><ul class="validation-list">${result.errors.map(error=>`<li>${escapeHtml(error)}</li>`).join('')}</ul>`;$('#saveDraft').disabled=!result.valid;}catch(error){parsed=null;$('#saveDraft').disabled=true;box.classList.remove('hidden');box.className='alert error';box.textContent=error instanceof SyntaxError?'JSON 格式不正确，请检查逗号、引号和括号。':error.message;}};
$('#saveDraft').onclick=async()=>{if(!parsed)return;try{await api('/api/cards',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(parsed)});toast('卡片草稿已保存');$('#saveDraft').disabled=true;await load();}catch(error){toast(error.message);}};load();
</script></body></html>
