<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="复习 Fluent Science Reading 课程中的核心科学英语词汇。"><meta property="og:title" content="Fluent Science Reading · Core Words"><meta property="og:description" content="在科学故事中复习核心英语词汇。"><meta property="og:image" content="/og.png"><meta name="twitter:card" content="summary_large_image">
  <title>核心词库 · Fluent Science Reading</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    .words-hero { display:grid;grid-template-columns:1fr minmax(220px,.45fr);gap:24px;align-items:end;padding:28px;margin-bottom:18px;background:linear-gradient(135deg,#fff,#eff7ff) }
    .search {display:flex;gap:8px;padding:8px;border:1px solid var(--line);border-radius:15px;background:#fff}.search input{min-width:0;flex:1;border:0;padding:8px;outline:0;color:var(--ink)}
    .word-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.word-card{padding:18px;display:grid;gap:10px}.word-card h2{margin:0;font-size:25px}.word-card p{margin:0;color:var(--muted)}.source{padding-top:10px;border-top:1px dashed var(--line);font-size:12px}.source a{color:var(--blue);font-weight:850}.word-actions{display:flex;justify-content:space-between;align-items:center;gap:8px}
    @media(max-width:900px){.word-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.words-hero{grid-template-columns:1fr;padding:20px}.word-grid{grid-template-columns:1fr}}
  </style>
</head>
<body><div class="shell"><div id="nav"></div><section class="panel words-hero"><div><p class="eyebrow">Core word bank</p><h1 class="page-title">把科学词汇带回原文</h1><p class="muted">搜索、听发音，并随时回到词汇出现的阅读卡片。</p></div><label class="search"><span class="hidden">搜索词汇</span><input id="search" type="search" placeholder="搜索单词或释义…" autocomplete="off"><span class="badge" id="count">0 words</span></label></section><main id="words" class="word-grid" aria-live="polite"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></main></div>
<script type="module">
import{$,api,escapeHtml,nav,speak}from'/shared.js';$('#nav').innerHTML=nav('words');const state={words:[],query:''};
function render(){const query=state.query.trim().toLowerCase();const visible=state.words.filter(word=>!query||`${word.english} ${word.meaning}`.toLowerCase().includes(query));$('#count').textContent=`${visible.length} words`;$('#words').innerHTML=visible.length?visible.map(word=>`<article class="panel word-card"><div><p class="eyebrow">Science word</p><h2>${escapeHtml(word.english)}</h2><p>${escapeHtml(word.meaning||'暂无释义')}</p></div><div class="source">来自 ${word.sources.map(source=>`<a href="/lesson/${encodeURIComponent(source.slug)}">${escapeHtml(source.title)}</a>`).join('、')}</div><div class="word-actions"><span class="badge">${escapeHtml(word.sources[0]?.theme||'Science')}</span><button class="btn blue" type="button" data-speak="${escapeHtml(word.english)}">播放发音</button></div></article>`).join(''):'<div class="state-box"><strong>没有找到匹配词汇</strong>试试更短的关键词。</div>';document.querySelectorAll('[data-speak]').forEach(button=>button.onclick=()=>speak(button.dataset.speak));}
$('#search').oninput=event=>{state.query=event.target.value;render()};
api('/api/words').then(data=>{state.words=data.words||[];render()}).catch(error=>{$('#words').innerHTML=`<div class="state-box"><strong>词库加载失败</strong>${escapeHtml(error.message)}<br><button class="btn" onclick="location.reload()">重新加载</button></div>`});
</script></body></html>
