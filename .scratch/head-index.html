<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Fluent Science Reading 互动英语科普学习卡片。">
  <meta property="og:title" content="Fluent Science Reading Lesson">
  <meta property="og:description" content="Read · Think · Explain — 互动英语科普学习卡片。">
  <meta property="og:image" content="/og.png">
  <meta name="twitter:card" content="summary_large_image">
  <title>学习卡片 · Fluent Science Reading</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    .lesson-head { display: grid; grid-template-columns: 1fr auto; gap: 18px; align-items: end; padding: 22px 24px; margin-bottom: 12px; }
    .lesson-head h1 { margin: 0; font-size: clamp(27px,4vw,42px); line-height: 1.08; }
    .lesson-meta { display: flex; gap: 7px; flex-wrap: wrap; margin-bottom: 8px; }
    .module-nav { position: sticky; top: 8px; z-index: 20; display: grid; grid-template-columns: repeat(6,1fr); gap: 6px; padding: 7px; margin-bottom: 14px; background: rgba(255,255,255,.94); backdrop-filter: blur(12px); }
    .module-tab { min-width: 0; border: 0; border-radius: 13px; padding: 10px 7px; background: transparent; color: var(--muted); cursor: pointer; font-size: 12px; font-weight: 850; }
    .module-tab span { display: block; margin: 0 auto 4px; width: 8px; height: 8px; border: 2px solid #a8b5c4; border-radius: 50%; }
    .module-tab.active { color: var(--blue); background: var(--blue-soft); }
    .module-tab.done span { border-color: var(--green); background: var(--green); }
    .workspace { min-height: 620px; }
    .module { display: none; }
    .module.active { display: block; }
    .split { display: grid; grid-template-columns: 1.02fr .98fr; gap: 16px; align-items: start; }
    .content-card { padding: 17px; }
    .cover { display: block; width: 100%; max-height: 560px; object-fit: cover; object-position: top; border-radius: 15px; background: #eef2f6; }
    .article-copy { padding: 22px; }
    .article-copy p { margin: 0 0 14px; font-size: clamp(19px,2.3vw,25px); line-height: 1.8; font-weight: 750; }
    .sentence { border: 0; padding: 0; background: transparent; color: inherit; font: inherit; text-align: left; border-radius: 9px; cursor: pointer; }
    .sentence:hover, .sentence.current { background: #fff0e9; }
    .listen-stage { padding: 26px; }
    .big-question { margin: 12px 0 22px; padding: 18px; border-radius: 12px; background: var(--surface-warm); font-size: 22px; font-weight: 850; }
    .player { display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: center; padding: 17px; border-radius: 17px; background: var(--ink); color: #fff; }
    .play-round { width: 58px; height: 58px; border: 0; border-radius: 50%; background: var(--brand); color: #fff; font-weight: 900; cursor: pointer; }
    .speed-row { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 12px; }
    .speed { border: 1px solid rgba(255,255,255,.35); border-radius: 999px; padding: 6px 10px; background: transparent; color: #fff; cursor: pointer; }
    .speed.active { background: #fff; color: var(--ink); }
    .transcript { display: grid; gap: 7px; margin-top: 16px; }
    .transcript button { display: grid; grid-template-columns: 35px 1fr; gap: 8px; width: 100%; border: 1px solid var(--line); border-radius: 12px; padding: 10px; background: #fff; text-align: left; color: var(--ink); cursor: pointer; }
    .transcript button.current { border-color: var(--brand); background: #fff3ee; }
    .record-box { margin-top: 16px; padding: 18px; border: 1px solid var(--line); border-radius: 16px; }
    .record-box blockquote { margin: 10px 0; font-size: 19px; font-weight: 800; }
    .practice-shell { padding: 24px; }
    .practice-intro { display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; margin-bottom: 18px; }
    .match-board { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .match-column { display: grid; gap: 8px; }
    .match-choice { width: 100%; min-height: 50px; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: #fff; color: var(--ink); text-align: left; font-weight: 800; cursor: pointer; }
    .match-choice.selected { border-color: var(--blue); background: var(--blue-soft); }
    .match-choice.matched { border-color: #9fcdb8; background: var(--green-soft); color: var(--green); }
    .subsection { margin-top: 24px; padding-top: 22px; border-top: 1px dashed var(--line); }
    .question { margin: 11px 0; padding: 16px; border: 1px solid var(--line); border-radius: 15px; background: #fff; }
    .question h3 { margin: 5px 0 12px; font-size: 18px; }
    .options { display: grid; gap: 8px; }
    .option { width: 100%; border: 1px solid var(--line); border-radius: 11px; padding: 11px 12px; background: #f9fbfd; color: var(--ink); text-align: left; cursor: pointer; font-weight: 750; }
    .option.selected { border-color: var(--blue); background: var(--blue-soft); }
    .option.correct { border-color: #82b99f; background: var(--green-soft); }
    .option.wrong { border-color: #e0a4a4; background: var(--red-soft); }
    .feedback { margin-top: 8px; font-size: 13px; font-weight: 800; }
    .rebuild-list { display: grid; gap: 8px; margin: 14px 0; }
    .rebuild-item { display: grid; grid-template-columns: 36px 1fr auto; gap: 9px; align-items: center; padding: 10px; border: 1px solid var(--line); border-radius: 12px; background: #fff; }
    .rebuild-index { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 9px; background: var(--blue-soft); color: var(--blue); font-weight: 900; }
    .move-buttons { display: flex; gap: 4px; }
    .move-buttons button { width: 34px; height: 34px; border: 1px solid var(--line); border-radius: 9px; background: #fff; cursor: pointer; }
    .result-grid { display: grid; grid-template-columns: .75fr 1.25fr; gap: 16px; }
    .score-card { padding: 26px; text-align: center; background: linear-gradient(145deg,var(--ink),#2a5688); color: #fff; }
    .score-ring { display: grid; place-items: center; width: 160px; height: 160px; margin: 20px auto; border-radius: 50%; background: conic-gradient(var(--yellow) var(--score),rgba(255,255,255,.15) 0); }
    .score-ring div { display: grid; place-items: center; width: 126px; height: 126px; border-radius: 50%; background: var(--ink); }
    .score-ring strong { font-size: 38px; }
    .result-list { display: grid; gap: 9px; padding: 20px; }
    .result-row { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; padding: 13px; border: 1px solid var(--line); border-radius: 13px; }
    .result-row strong, .result-row small { display: block; }
    .result-row small { color: var(--muted); }
    @media(max-width:820px){.split,.result-grid{grid-template-columns:1fr}.module-nav{overflow-x:auto;grid-template-columns:repeat(6,minmax(105px,1fr))}.lesson-head{grid-template-columns:1fr}.workspace{min-height:0}}
    @media(max-width:560px){.lesson-head,.practice-shell,.listen-stage,.article-copy{padding:16px}.match-board{grid-template-columns:1fr}.cover{max-height:440px}.practice-intro{display:block}.result-row{grid-template-columns:1fr}.module-nav{top:0}}
  </style>
</head>
<body>
  <div class="shell">
    <div id="nav"></div>
    <section id="loading" class="panel state-box"><strong>正在准备学习卡片…</strong>图片、正文和练习很快就好。</section>
    <div id="app" class="hidden">
      <section class="panel lesson-head">
        <div><div class="lesson-meta" id="meta"></div><h1 id="title"></h1><p id="bigQuestionLabel" class="muted"></p></div>
        <div><div class="muted" id="progressLabel">0 / 6 模块完成</div><div class="progress" style="width:190px;margin-top:7px"><span id="topProgress"></span></div></div>
      </section>
      <nav class="panel module-nav" id="moduleNav" aria-label="学习模块"></nav>
      <main class="workspace">
        <section class="module" data-module="reading" id="readingModule"></section>
        <section class="module" data-module="listening" id="listeningModule"></section>
        <section class="module" data-module="words" id="wordsModule"></section>
        <section class="module" data-module="comprehension" id="comprehensionModule"></section>
        <section class="module" data-module="rebuild" id="rebuildModule"></section>
        <section class="module" data-module="result" id="resultModule"></section>
      </main>
    </div>
    <section id="fatal" class="panel state-box hidden"><strong>这张学习卡片暂时打不开</strong><span id="fatalMessage"></span><br><a class="btn" href="/syllabus.html">返回课程目录</a></section>
  </div>
  <script type="module">
    import { $, $$, api, currentUserId, escapeHtml, nav, speak, toast, formatDate } from '/shared.js';
    $('#nav').innerHTML = nav();
    const modules = [
      ['reading','Reading','阅读'],['listening','Listen & Read','听读'],['words','Words','核心词'],
      ['comprehension','3Q','理解'],['rebuild','Rebuild','重建'],['result','Result','结果']
    ];
    const state = { card:null, active:'reading', rate:1, current:-1, practiceCurrent:-1, playing:false, selectedWord:null, selectedMeaning:null, matched:[], context:{}, comprehension:{}, comprehensionChecked:false, rebuild:[], rebuildChecked:false, moduleStatus:{}, recording:null, recordingUrl:null };
    const slug = location.pathname.startsWith('/lesson/') ? decodeURIComponent(location.pathname.split('/').filter(Boolean).pop()) : new URLSearchParams(location.search).get('lesson') || 'day001-flower';
    const sentences = () => (state.card.paragraphs || []).flatMap(p => typeof p === 'string' ? (p.match(/[^.!?]+[.!?]+/g) || [p]) : (p.sentences || []).map(s => s.text || s));
    const practiceSentences = () => state.card.listenRead?.sentences?.length ? state.card.listenRead.sentences : sentences().slice(0,2).map((sentence,index)=>({sentence,role:index?'Structure':'Science Core'}));
    const words = () => state.card.word_bank || [];
    const contextQuestions = () => state.card.wordModule?.contextQuestions || [];
    const compQuestions = () => state.card.comprehension?.questions || [];
    const rebuildSteps = () => state.card.rebuild?.steps || [];
    const isDone = name => Boolean(typeof state.moduleStatus[name] === 'object' ? state.moduleStatus[name].completed : state.moduleStatus[name]);
    const scoreOf = name => Number(typeof state.moduleStatus[name] === 'object' ? state.moduleStatus[name].score || 0 : 0);
    const completedCount = () => ['reading','listening','words','comprehension','rebuild','result'].filter(isDone).length;

    function highlightSentence(text, index) {
      return `<button type="button" class="sentence ${state.current === index ? 'current' : ''}" data-sentence="${index}" aria-label="播放句子 ${index+1}">${escapeHtml(text)}</button>`;
    }

    function renderNav() {
      $('#moduleNav').innerHTML = modules.map(([id,en,zh]) => `<button type="button" class="module-tab ${state.active===id?'active':''} ${isDone(id)?'done':''}" data-open="${id}" aria-selected="${state.active===id}"><span></span>${en}<small>${zh}</small></button>`).join('');
      $$('[data-open]').forEach(button => button.onclick = () => openModule(button.dataset.open));
      const done = completedCount();
      $('#progressLabel').textContent = `${done} / 6 模块完成`;
      $('#topProgress').style.width = `${Math.round(done/6*100)}%`;
    }

    function openModule(name, save = true) {
      state.active = name;
      $$('.module').forEach(node => node.classList.toggle('active', node.dataset.module === name));
      renderNav();
      if (name === 'result') renderResult();
      if (save) saveProgress();
      window.scrollTo({top:0,behavior:'smooth'});
    }

    function renderReading() {
      let cursor = 0;
      const paragraphs = (state.card.paragraphs || []).map(paragraph => {
        const ss = typeof paragraph === 'string' ? (paragraph.match(/[^.!?]+[.!?]+/g) || [paragraph]) : (paragraph.sentences || []).map(s => s.text || s);
        const html = ss.map(text => highlightSentence(text, cursor++)).join(' ');
        return `<p>${html}</p>`;
      }).join('');
      $('#readingModule').innerHTML = `<div class="split"><div class="panel content-card"><img class="cover" src="/${escapeHtml(state.card.image_file || state.card.image || 'day001-flower.png')}" alt="${escapeHtml(state.card.title)} 科普阅读卡片"></div><article class="panel article-copy"><p class="eyebrow">Read the science story</p><h2 class="section-title">图文阅读</h2><div style="margin:18px 0">${paragraphs}</div><div class="btn-row"><button class="btn primary" id="finishReading" type="button">${isDone('reading')?'已完成阅读':'完成阅读'}</button><button class="btn" id="readAll" type="button">朗读全文</button><button class="btn ghost" data-next="listening" type="button">下一步：听读</button></div></article></div>`;
      $$('[data-sentence]').forEach(node => { node.onclick = () => { state.current = Number(node.dataset.sentence); renderReading(); speak(sentences()[state.current], state.rate); }; });
      $('#finishReading').onclick = () => complete('reading',100,'阅读模块已完成');
      $('#readAll').onclick = () => playAll(() => complete('reading',100,'全文朗读完成'));
      bindNext();
    }

    function playAll(onfinish) {
      if (state.playing) { speechSynthesis.cancel(); state.playing=false; renderListening(); return; }
      state.playing=true; let i=0;
      const next=()=>{ if(!state.playing||i>=sentences().length){state.playing=false;state.current=-1;renderListening();onfinish?.();return;} state.current=i; renderListening(); speak(sentences()[i++],state.rate,next); };
      next();
    }

    function renderListening() {
      const practice=practiceSentences(); const core=state.card.listenRead?.coreSentence || practice[0]?.sentence || '';
      $('#listeningModule').innerHTML=`<div class="panel listen-stage"><p class="eyebrow">Listen · notice · speak</p><h2 class="section-title">Listen & Read</h2><div class="big-question">${escapeHtml(state.card.bigQuestion||'Listen to the story, then read it aloud.')}</div><div class="player"><button id="playAll" class="play-round" type="button">${state.playing?'停止':'播放'}</button><div><strong>${state.playing?`正在播放第 ${state.current+1} 句`:'全文朗读'}</strong><div class="speed-row">${[.8,1,1.2,1.5].map(rate=>`<button type="button" class="speed ${state.rate===rate?'active':''}" data-rate="${rate}">${rate.toFixed(1)}x</button>`).join('')}</div></div></div><div class="transcript">${practice.map((item,i)=>`<button type="button" class="${!state.playing&&state.practiceCurrent===i?'current':''}" data-listen-sentence="${i}"><span>${String(i+1).padStart(2,'0')}</span><span><small class="eyebrow">${escapeHtml(item.role||'Read aloud')}</small>${escapeHtml(item.sentence)}</span></button>`).join('')}</div><div class="record-box"><p class="eyebrow">Core sentence</p><blockquote>“${escapeHtml(core)}”</blockquote><p class="muted">先听示范，再录下你的朗读。录音提交后会显示“待评分”。</p><div class="btn-row"><button class="btn" id="demoCore" type="button">听示范</button><button class="btn primary" id="record" type="button">${state.recording?'停止录音':'开始录音'}</button>${state.recordingUrl?'<audio id="recordPreview" controls></audio><button class="btn blue" id="submitRecord" type="button">提交录音</button>':''}<button class="btn ghost" data-next="words" type="button">下一步：核心词</button></div></div></div>`;
      $('#playAll').onclick=()=>playAll(()=>complete('listening',100,'听读模块已完成'));
      $$('.speed').forEach(button=>button.onclick=()=>{state.rate=Number(button.dataset.rate);renderListening();});
      $$('[data-listen-sentence]').forEach(button=>button.onclick=()=>{state.practiceCurrent=Number(button.dataset.listenSentence);renderListening();speak(practice[state.practiceCurrent].sentence,state.rate);});
      $('#demoCore').onclick=()=>speak(core,state.rate);
      $('#record').onclick=toggleRecording;
      if(state.recordingUrl){const audio=$('#recordPreview');audio.src=state.recordingUrl;$('#submitRecord').onclick=()=>submitRecording(core);}
      bindNext();
    }

    async function toggleRecording(){
      if(state.recording){state.recording.stop();return;}
      if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){toast('当前浏览器不支持录音，可通过全文朗读完成本模块');return;}
      try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});const chunks=[];const recorder=new MediaRecorder(stream);state.recording=recorder;recorder.ondataavailable=e=>chunks.push(e.data);recorder.onstop=()=>{stream.getTracks().forEach(track=>track.stop());const blob=new Blob(chunks,{type:recorder.mimeType||'audio/webm'});if(state.recordingUrl)URL.revokeObjectURL(state.recordingUrl);state.recordingUrl=URL.createObjectURL(blob);state.recordingBlob=blob;state.recording=null;renderListening();};recorder.start();renderListening();}catch{toast('没有获得麦克风权限，请在浏览器设置中允许录音');}
    }
    async function submitRecording(core){try{await api(`/api/recordings/${encodeURIComponent(currentUserId())}`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({cardId:state.card.cardId,targetSentence:core,mime:state.recordingBlob?.type,size:state.recordingBlob?.size})});complete('listening',100,'录音已提交，等待评分');}catch(error){toast(error.message);}}

    function renderWords(){
      const pairs=state.card.wordModule?.matchPairs||words().map(word=>({word:word.english,meaning:word.chinese||word.meaning}));
      const meanings=[...pairs].sort((a,b)=>a.meaning.localeCompare(b.meaning));
      $('#wordsModule').innerHTML=`<div class="panel practice-shell"><div class="practice-intro"><div><p class="eyebrow">Word Match</p><h2 class="section-title">把核心词和含义连起来</h2><p class="muted">先选左边的单词，再选右边的含义。正确配对会被锁定。</p></div><span class="badge ${state.matched.length===pairs.length?'success':''}">${state.matched.length} / ${pairs.length} 已配对</span></div><div class="match-board"><div class="match-column">${pairs.map(pair=>`<button type="button" class="match-choice ${state.selectedWord===pair.word?'selected':''} ${state.matched.includes(pair.word)?'matched':''}" data-match-word="${escapeHtml(pair.word)}" ${state.matched.includes(pair.word)?'disabled':''}>${escapeHtml(pair.word)}</button>`).join('')}</div><div class="match-column">${meanings.map(pair=>`<button type="button" class="match-choice ${state.selectedMeaning===pair.meaning?'selected':''} ${state.matched.includes(pair.word)?'matched':''}" data-match-meaning="${escapeHtml(pair.meaning)}" data-match-answer="${escapeHtml(pair.word)}" ${state.matched.includes(pair.word)?'disabled':''}>${escapeHtml(pair.meaning)}</button>`).join('')}</div></div><div class="btn-row" style="margin-top:12px"><button class="btn" id="resetMatch" type="button">重置配对</button></div><div class="subsection"><p class="eyebrow">Word in context</p><h2 class="section-title">在句子里选择正确单词</h2><div id="contextQuestions">${renderQuestions(contextQuestions(),state.context,'context')}</div><div class="btn-row"><button class="btn primary" id="checkWords" type="button">检查词汇练习</button><button class="btn ghost" data-next="comprehension" type="button">下一步：3Q 理解</button></div></div></div>`;
      $$('[data-match-word]').forEach(button=>button.onclick=()=>{state.selectedWord=button.dataset.matchWord;tryMatch();renderWords();});
      $$('[data-match-meaning]').forEach(button=>button.onclick=()=>{state.selectedMeaning=button.dataset.matchMeaning;state.selectedMeaningAnswer=button.dataset.matchAnswer;tryMatch();renderWords();});
      $('#resetMatch').onclick=()=>{state.matched=[];state.selectedWord=null;state.selectedMeaning=null;renderWords();saveProgress();};
      bindQuestionOptions('context',state.context,contextQuestions(),renderWords);
      $('#checkWords').onclick=()=>{const qs=contextQuestions();const correct=qs.filter((q,i)=>state.context[i]===answerKey(q)).length;const completeMatch=state.matched.length===pairs.length;if(!completeMatch||Object.keys(state.context).length<qs.length){toast('请先完成全部配对和语境题');return;}complete('words',Math.round((correct+state.matched.length)/(qs.length+pairs.length)*100),`词汇练习完成：${correct}/${qs.length} 道语境题正确`);renderWords();};
      bindNext();
    }
    function tryMatch(){if(!state.selectedWord||!state.selectedMeaning)return;if(state.selectedWord===state.selectedMeaningAnswer){state.matched.push(state.selectedWord);toast('配对正确');}else toast('还不匹配，再想一想');state.selectedWord=null;state.selectedMeaning=null;state.selectedMeaningAnswer=null;saveProgress();}

    function normalizeOptions(q){return Array.isArray(q.options)?Object.fromEntries(q.options.map((value,i)=>[String.fromCharCode(65+i),value])):q.options||{};}
    function answerKey(q){if(['A','B','C'].includes(q.answer))return q.answer;return Object.entries(normalizeOptions(q)).find(([,value])=>value===q.answer)?.[0]||q.answer;}
    function renderQuestions(qs,answers,prefix,checked=false){return qs.map((q,i)=>{const correctKey=answerKey(q);return `<article class="question"><p class="eyebrow">${escapeHtml(q.type||`Question ${i+1}`)}</p><h3>${escapeHtml(q.prompt)}</h3><div class="options">${Object.entries(normalizeOptions(q)).map(([key,value])=>{const selected=answers[i]===key;const result=checked&&selected?(key===correctKey?'correct':'wrong'):checked&&key===correctKey?'correct':'';return `<button type="button" class="option ${selected?'selected':''} ${result}" data-answer-group="${prefix}" data-question="${i}" data-answer="${key}"><strong>${key}.</strong> ${escapeHtml(value)}</button>`;}).join('')}</div>${checked?`<div class="feedback">${answers[i]===correctKey?'✓ 回答正确':`需要复习，正确答案是 ${correctKey}`}</div>`:''}</article>`}).join('');}
    function bindQuestionOptions(prefix,answers,qs,rerender){$$(`[data-answer-group="${prefix}"]`).forEach(button=>button.onclick=()=>{answers[button.dataset.question]=button.dataset.answer;rerender();saveProgress();});}

    function renderComprehension(){const qs=compQuestions();$('#comprehensionModule').innerHTML=`<div class="panel practice-shell"><div class="practice-intro"><div><p class="eyebrow">3Q Understanding System</p><h2 class="section-title">从全文到新情境</h2><p class="muted">Whole 看整体，Connection 找关系，Transfer 把知识用到新情境。</p></div><span class="badge">${Object.keys(state.comprehension).length} / 3 已作答</span></div>${renderQuestions(qs,state.comprehension,'comp',state.comprehensionChecked)}<div class="btn-row"><button class="btn primary" id="checkComp" type="button">${state.comprehensionChecked?'重新检查':'检查答案'}</button><button class="btn" id="retryComp" type="button">再试一次</button><button class="btn ghost" data-next="rebuild" type="button">下一步：结构重建</button></div></div>`;bindQuestionOptions('comp',state.comprehension,qs,()=>{state.comprehensionChecked=false;renderComprehension();});$('#checkComp').onclick=()=>{if(Object.keys(state.comprehension).length<qs.length){toast('请先回答全部三道题');return;}state.comprehensionChecked=true;const correct=qs.filter((q,i)=>state.comprehension[i]===answerKey(q)).length;complete('comprehension',Math.round(correct/qs.length*100),`3Q 完成：${correct}/3 正确`);renderComprehension();};$('#retryComp').onclick=()=>{state.comprehension={};state.comprehensionChecked=false;state.moduleStatus.comprehension={completed:false,score:0};renderComprehension();saveProgress();};bindNext();}

    function renderRebuild(){const steps=rebuildSteps();if(!state.rebuild.length)state.rebuild=[...steps.keys()].sort(()=>Math.random()-.5);$('#rebuildModule').innerHTML=`<div class="panel practice-shell"><div class="practice-intro"><div><p class="eyebrow">${escapeHtml(state.card.articleStructure||state.card.structure||'Article Structure')}</p><h2 class="section-title">重建文章的科学结构</h2><p class="muted">用上下按钮调整顺序，让信息重新组成清晰的科学关系。</p></div><span class="badge ${isDone('rebuild')?'success':''}">${isDone('rebuild')?'已提交':'等待检查'}</span></div><div class="rebuild-list">${state.rebuild.map((stepIndex,pos)=>`<div class="rebuild-item"><span class="rebuild-index">${pos+1}</span><strong>${escapeHtml(steps[stepIndex])}</strong><span class="move-buttons"><button type="button" data-move="${pos}" data-dir="-1" aria-label="向上移动" ${pos===0?'disabled':''}>↑</button><button type="button" data-move="${pos}" data-dir="1" aria-label="向下移动" ${pos===steps.length-1?'disabled':''}>↓</button></span></div>`).join('')}</div>${state.rebuildChecked?`<div class="alert ${scoreOf('rebuild')===100?'success':'error'}">${scoreOf('rebuild')===100?'结构正确！你已经抓住了文章关系。':'顺序还需要调整。看看信息是怎样一步步发生或相互作用的。'}</div>`:''}<div class="btn-row" style="margin-top:14px"><button class="btn primary" id="checkRebuild" type="button">检查结构</button><button class="btn" id="resetRebuild" type="button">重新打乱</button><button class="btn ghost" data-next="result" type="button">查看学习结果</button></div></div>`;$$('[data-move]').forEach(button=>button.onclick=()=>{const from=Number(button.dataset.move),to=from+Number(button.dataset.dir);[state.rebuild[from],state.rebuild[to]]=[state.rebuild[to],state.rebuild[from]];state.rebuildChecked=false;renderRebuild();saveProgress();});$('#checkRebuild').onclick=()=>{const expected=[...steps.keys()];const correct=state.rebuild.filter((value,i)=>value===expected[i]).length;state.rebuildChecked=true;complete('rebuild',Math.round(correct/steps.length*100),correct===steps.length?'结构重建正确':'已保存本次结构答案');renderRebuild();};$('#resetRebuild').onclick=()=>{state.rebuild=[...steps.keys()].sort(()=>Math.random()-.5);state.rebuildChecked=false;renderRebuild();saveProgress();};bindNext();}

    function renderResult(){if(['reading','listening','words','comprehension','rebuild'].every(isDone)&&!isDone('result')){state.moduleStatus.result={completed:true,score:100,completedAt:new Date().toISOString()};setTimeout(saveProgress,0);}const done=completedCount();const percent=Math.round(done/6*100);const items=[['reading','Reading','图文阅读'],['listening','Listen & Read','听读与录音'],['words','Words','匹配与语境'],['comprehension','3Q','阅读理解'],['rebuild','Rebuild','结构重建'],['result','Result','学习汇总']];$('#resultModule').innerHTML=`<div class="result-grid"><section class="panel score-card"><p class="eyebrow" style="color:#ffd6c9">Lesson result</p><h2>本课学习结果</h2><div class="score-ring" style="--score:${percent}%"><div><strong>${percent}%</strong><span>${done} / 6 完成</span></div></div><p>${percent===100?'所有模块都完成了，做得很棒！':percent>=50?'已经过半，完成剩余模块就能点亮整课。':'从任意模块开始，系统会为你保存进度。'}</p></section><section class="panel result-list"><div><p class="eyebrow">Module details</p><h2 class="section-title">模块明细</h2></div>${items.map(([id,en,zh])=>`<div class="result-row"><div><strong>${en} · ${zh}</strong><small>${isDone(id)?`已完成${['words','comprehension','rebuild'].includes(id)?` · 得分 ${scoreOf(id)}`:''}`:'尚未完成'}</small></div><button class="btn ${isDone(id)?'':'primary'}" type="button" data-result-open="${id}">${isDone(id)?'查看':'继续'}</button></div>`).join('')}<div class="btn-row"><a class="btn primary" href="/syllabus.html">返回课程</a><button class="btn" id="restart" type="button">再学一次</button></div></section></div>`;$$('[data-result-open]').forEach(button=>button.onclick=()=>openModule(button.dataset.resultOpen));$('#restart').onclick=()=>{if(!confirm('要清空本课页面中的答案并重新开始吗？'))return;state.context={};state.comprehension={};state.matched=[];state.rebuild=[];state.moduleStatus={};renderAll();openModule('reading');saveProgress();};renderNav();}

    function bindNext(){$$('[data-next]').forEach(button=>button.onclick=()=>openModule(button.dataset.next));}
    function complete(module,score,message){state.moduleStatus[module]={completed:true,score,completedAt:new Date().toISOString()};toast(message);renderNav();saveProgress();}
    async function saveProgress(){if(!state.card)return;const completedPercent=Math.round(completedCount()/6*100);try{await api(`/api/progress/${encodeURIComponent(currentUserId())}`,{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify({cardId:state.card.cardId,lastModule:state.active,answers:{context:state.context,comprehension:state.comprehension},matched:state.matched,rebuild:state.rebuild,moduleStatus:state.moduleStatus,completedPercent})});}catch{}}
    async function loadProgress(){try{const data=await api(`/api/progress/${encodeURIComponent(currentUserId())}`);const saved=data.cards?.[state.card.cardId];if(!saved)return;state.context=saved.answers?.context||{};state.comprehension=saved.answers?.comprehension||saved.answers||{};state.matched=saved.matched||[];state.rebuild=saved.rebuild||saved.steps||[];state.moduleStatus=saved.moduleStatus||{};state.active=saved.lastModule||'reading';}catch{}}
    function renderAll(){renderReading();renderListening();renderWords();renderComprehension();renderRebuild();renderResult();renderNav();}

    async function boot(){try{state.card=await api(`/api/cards/${encodeURIComponent(slug)}`);await loadProgress();document.title=`${state.card.title} · Fluent Science Reading`;$('#meta').innerHTML=`<span class="badge">DAY ${String(state.card.day).padStart(3,'0')}</span><span class="badge">${escapeHtml(state.card.level||'L1')}</span><span class="badge">${escapeHtml(state.card.theme||'')}</span><span class="badge warning">${escapeHtml(state.card.articleStructure||state.card.structure||'Science Reading')}</span>`;$('#title').textContent=state.card.title;$('#bigQuestionLabel').textContent=state.card.bigQuestion||'';$('#loading').classList.add('hidden');$('#app').classList.remove('hidden');renderAll();openModule(state.active,false);}catch(error){$('#loading').classList.add('hidden');$('#fatal').classList.remove('hidden');$('#fatalMessage').textContent=error.message;}}
    boot();
  </script>
</body>
</html>
